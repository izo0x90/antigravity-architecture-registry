[pack]
name = "scip-typescript"
kind = "indexer"
version = "1.0.0"
description = "scip-typescript (built on the TypeScript compiler): exact links and types for TypeScript and JavaScript, written as SCIP. Installed into its pack folder with npm."

[tool]
name = "scip-typescript"
version = "0.4.0"
supports = ">=0.4.0, <0.5.0"
[tool.check]
command = "{dest}/node_modules/.bin/scip-typescript"
args = ["--version"]
version = '^(\d+\.\d+\.\d+)'

[[install]]
platforms = ["linux-x86_64", "linux-arm64", "macos-arm64", "macos-x86_64"]
[[install.steps]]
run = { command = "npm", args = ["install", "--prefix", ".", "--no-save", "--no-audit", "--no-fund", "@sourcegraph/scip-typescript@{tool_version}"] }

[run]
command = "{dest}/node_modules/.bin/scip-typescript"
args = ["index", "--cwd", "{root}", "--infer-tsconfig", "--no-progress-bar", "--output", "{out}"]
output = "scip"
timeout_s = 1800
