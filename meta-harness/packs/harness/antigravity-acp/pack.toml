[pack]
name = "antigravity-acp"
kind = "harness"
version = "1.2.0"
description = "Google Antigravity's ACP server: the agent harness the cockpit drives."

[tool]
name = "agy_acp_server"
version = "1.4.3"
supports = ">=1.4.0, <1.5.0"

# The server has no version command: it's started and asked over ACP, and
# answers with its version (`1.4.3`). Emulated (below) it takes a while to
# answer.
[tool.check]
acp = { timeout_s = 300 }

# Google publishes Linux (x86_64, arm64) and macOS (arm64) builds.
[[install]]
platforms = ["linux-x86_64", "linux-arm64", "macos-arm64"]
# The harness the server starts for a session (its check, ACP initialize,
# doesn't start it).
holds = ["localharness_external"]

[install.vars.linux-x86_64]
folder = "linux"
asset = "linux-x86_64"
sha256 = "0634ce5306ba92c932945455e7a83fda78e2d99c33fa8aa6ee0566206a382714"

[install.vars.linux-arm64]
folder = "linux"
asset = "linux-arm64"
sha256 = "05c153443b0b1175151c760eeddea538950bc9843e317d54786a1f03670182bc"

[install.vars.macos-arm64]
folder = "macos"
asset = "darwin-arm64"
sha256 = "c57db0a9b8b712daa9c3c17cdb990a61842ea569f279e8bd79d7aa85a303b20b"

[[install.steps]]
download = { url = "https://dl.google.com/agy-extensions/releases/{folder}/agy-acp-server-{tool_version}-{asset}.zip", sha256 = "{sha256}", unpack = "zip" }

# The developer sandbox: Linux arm64 with 16 KiB pages, where Google's
# linux-arm64 server aborts (it assumes 4 KiB pages). The x86_64 server runs
# under QEMU user mode (>= 8.1, whose x86 guest has 4 KiB pages) with an
# x86_64 glibc; the harness it starts stays native arm64 (a static Go binary
# that breaks when emulated). Everything lands in the install folder.
[[install]]
platforms = ["linux-arm64-16k"]
holds = ["libexec/localharness_external"]

# The server drops privileges to group `nobody` and aborts without it.
[[install.steps]]
ensure_group = { name = "nobody" }

# QEMU user mode, from Debian (static, so it needs nothing else); from the
# snapshot archive, where a release stays after it leaves the pool.
[[install.steps]]
download = { url = "https://snapshot.debian.org/archive/debian/20260905T205002Z/pool/main/q/qemu/qemu-user_10.0.13%2Bds-0%2Bdeb13u1_arm64.deb", sha256 = "c73711af02b97cd5e2667e735d9c06890c57165517110ca4e646c95a7083158d", unpack = "deb", into = "qemu", extract = ["usr/bin/qemu-x86_64"] }

# x86_64 glibc for the emulated server (it links only glibc); from
# Launchpad's librarian, where a build stays.
[[install.steps]]
download = { url = "https://launchpadlibrarian.net/875852022/libc6_2.35-0ubuntu3.15_amd64.deb", sha256 = "79e35256227e16a607c154cdeb8d76ff12d20e31de286ea7fd9ad3b96fe0452d", unpack = "deb", into = "sysroot" }

# The package's loader link is absolute; QEMU's -L prefix needs it relative.
[[install.steps]]
link = { path = "sysroot/lib64/ld-linux-x86-64.so.2", target = "../lib/x86_64-linux-gnu/ld-linux-x86-64.so.2" }

# The x86_64 server and the native arm64 harness, from the same release,
# side by side: the server finds the harness next to itself (checked on the
# sandbox: a session starts and runs it with nothing set).
[[install.steps]]
download = { url = "https://dl.google.com/agy-extensions/releases/linux/agy-acp-server-{tool_version}-linux-x86_64.zip", sha256 = "0634ce5306ba92c932945455e7a83fda78e2d99c33fa8aa6ee0566206a382714", unpack = "zip", into = "libexec", extract = ["agy_acp_server.par"] }

[[install.steps]]
download = { url = "https://dl.google.com/agy-extensions/releases/linux/agy-acp-server-{tool_version}-linux-arm64.zip", sha256 = "05c153443b0b1175151c760eeddea538950bc9843e317d54786a1f03670182bc", unpack = "zip", into = "libexec", extract = ["localharness_external"] }

# The sandbox's proxy re-signs HTTPS with its own CA, and some of the
# server's calls trust only the CA bundles packed in the .par: the proxy's
# CA goes into those. Not behind the proxy: nothing to add. The .par's
# archive is a fixed-size section of the program, so each bundle keeps its
# size: the CA first, trailing certificates dropped to make room.
[[install.steps]]
system_ca = { store = "/etc/ssl/certs/ca-certificates.crt", subject = "Docker Sandboxes Proxy CA", save_as = "proxy-ca.pem", optional = true }

[[install.steps]]
patch_archive = { file = "libexec/agy_acp_server.par", members = ["google3/third_party/py/certifi/cacert.pem", "google3/third_party/py/httplib2/cacerts.txt", "google3/net/grpc/python/_cython/_credentials/roots.pem", "google3/third_party/py/grpc/_cython/_credentials/roots.pem"], append = "proxy-ca.pem", optional = true, keep_size = { block = "-----BEGIN CERTIFICATE-----", pad = "#" } }

# QEMU, the sysroot, the server; --uid: started as root, the server would
# otherwise drop to `nobody`, which can't read the user's ~/.gemini.
[install.launch]
program = "{dest}/qemu/usr/bin/qemu-x86_64"
args = ["-L", "{dest}/sysroot", "-E", "LD_LIBRARY_PATH={dest}/sysroot/lib/x86_64-linux-gnu", "{dest}/libexec/agy_acp_server.par", "--uid={user}"]

# The instance the cockpit drives, run by the ACP driver; the settings are
# what Antigravity's server does its own way.
[provides]
launch = { program = "{dest}/agy_acp_server.par" }
driver = "acp"
instance = "antigravity"
display_name = "Antigravity"

[provides.settings]
# It reads and writes the project's files through us.
client_fs = true
# A message's pieces, replayed: run on after its text, each headed by its
# label (1.1.1 to 1.4.3).
replayed_piece = "Embedded resource ({uri}):\n{content}"
# Its login opens no browser on the server's machine (`true` succeeds,
# doing nothing); it still prints the link, which the cockpit shows.
env = { BROWSER = "true" }

[provides.settings.modes]
approval_required = "default"
auto_accept_edits = "auto_edit"
full_access = "yolo"

[provides.settings.approval_warnings]
accept_for_session = "Also allows every later call like this in the thread."

# Its questions come as permission requests, on a made-up tool call
# `interaction_<hex>`, every answer "allow once" (agy_acp_server's
# `_ask_user_handler`, 1.1.1 to 1.4.3): those are questions, never answered
# for the user, and only their listed answers can go back.
[provides.settings.questions]
permission_tool_prefix = "interaction_"

# Its home: everything it keeps (paths.py, 1.1.1 to 1.4.3).
[provides.settings.dirs.gemini]
env = "GEMINI_HOME"
default = "{home}/.gemini"

# Its Google logins print a link and wait 300 s for the browser's callback
# on a local port; signed out, opening a session starts one (and doesn't
# answer). Its login is a file in its home (with the file storage forced:
# else, on macOS, the Keychain).
[provides.settings.login]
link = 'https://accounts\.google\.com/\S+'
within_s = 300
# It shows its link 14 s after starting, emulated (on the sandbox).
wait_s = 60
kept = "{gemini}/antigravity-acp/acp_token.json"
on_session = true

# Moved by GEMINI_HOME; its login kept as a file there too.
[provides.settings.home]
dir = "gemini"
env = { AGY_ACP_FORCE_FILE_STORAGE = "1" }

# Where it finds skills, in its order (the first of a name wins): a skill's
# name is its frontmatter's, else its file's; `skill.md` in any case; a
# folder's skills in URL-escaped order.
[provides.settings.skills]
name = "file"
file = "any_case"
order = "escaped_path"
roots = [
    { path = "{gemini}/config/skills", scope = "user" },
    { path = "{project}/.gemini/skills", scope = "project" },
    { path = "{gemini}/antigravity-cli/skills", scope = "user" },
    { path = "{project}/.agents/skills", scope = "project" },
    { path = "{project}/.agent/skills", scope = "project" },
]
