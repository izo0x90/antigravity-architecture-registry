[pack]
name = "monaspace-neon"
kind = "font"
version = "1.0.0"
description = "Monaspace Neon (GitHub): a neo-grotesque code face from a matched family, with texture healing."

# The font's release (SIL Open Font License).
[tool]
name = "Monaspace Neon"
version = "1.400.0"
supports = ">=1.400.0, <2.0.0"

# A font is the same on every platform: its release, two faces kept.
[[install]]
platforms = ["linux-x86_64", "linux-arm64", "linux-arm64-16k", "macos-arm64", "macos-x86_64"]
holds = ["Static Fonts/Monaspace Neon/MonaspaceNeon-Regular.otf", "Static Fonts/Monaspace Neon/MonaspaceNeon-Bold.otf"]

[[install.steps]]
download = { url = "https://github.com/githubnext/monaspace/releases/download/v1.400/monaspace-static-v1.400.zip", sha256 = "ab66d71be751495f679727332a3345597943bd4d7beebca03f5cde04bf994de7", unpack = "zip", extract = ["Static Fonts/Monaspace Neon/MonaspaceNeon-Regular.otf", "Static Fonts/Monaspace Neon/MonaspaceNeon-Bold.otf"], timeout_s = 600 }

[font]
family = "Monaspace Neon"
regular = "Static Fonts/Monaspace Neon/MonaspaceNeon-Regular.otf"
bold = "Static Fonts/Monaspace Neon/MonaspaceNeon-Bold.otf"
