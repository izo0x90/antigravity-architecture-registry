[pack]
name = "commit-mono"
kind = "font"
version = "1.0.0"
description = "Commit Mono: neutral and calm, a modern face that stays out of the way."

# The font's release (SIL Open Font License).
[tool]
name = "Commit Mono"
version = "1.143.0"
supports = ">=1.143.0, <2.0.0"

# A font is the same on every platform: its release, two faces kept.
[[install]]
platforms = ["linux-x86_64", "linux-arm64", "linux-arm64-16k", "macos-arm64", "macos-x86_64"]
holds = ["CommitMono-1.143/ttfautohint/CommitMono-400-Regular.ttf", "CommitMono-1.143/ttfautohint/CommitMono-700-Regular.ttf"]

[[install.steps]]
download = { url = "https://github.com/eigilnikolajsen/commit-mono/releases/download/v1.143/CommitMono-1.143.zip", sha256 = "f7d1f26a7c7554800a996f76f5d706bf0648b936ca2a66b5bc4d46e3a2c49ed0", unpack = "zip", extract = ["CommitMono-1.143/ttfautohint/CommitMono-400-Regular.ttf", "CommitMono-1.143/ttfautohint/CommitMono-700-Regular.ttf"] }

[font]
family = "Commit Mono"
regular = "CommitMono-1.143/ttfautohint/CommitMono-400-Regular.ttf"
bold = "CommitMono-1.143/ttfautohint/CommitMono-700-Regular.ttf"
