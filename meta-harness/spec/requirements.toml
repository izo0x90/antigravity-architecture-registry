# NAH architecture graph: requirements as data.
#
# Every requirement has an id (matching the task list), the slice it ships in,
# a title and one testable acceptance sentence.
#
# Proof: a test tagged with the id, directly above the test function:
#   Rust:   // req: P5.3            (several: // req: P5.3, P5.4)
#   Python: # req: P5.3
# A requirement is VERIFIED when at least one tagged test exists and all its
# tagged tests pass; OPEN with no tagged test; FAILING otherwise.
# `manual = true` requirements (audits, review gates, decisions) are proven by
# a `done = "<date>: <evidence>"` field instead of tests.
#
# Slices ship end to end in order: S0 guardrails, S1 thin vertical slice
# (one language, containment + calls, ingest -> plan -> skeleton -> verify ->
# graph/spec/hints), S2 widen (all rules, languages, review loop), S3
# orchestration and full UI, S4 live run and final audit.
# Status: `python3 scripts/req_status.py --full` (from meta-harness/).

