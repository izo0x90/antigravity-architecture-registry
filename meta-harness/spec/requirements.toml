# ---- I: indexing control and state (agreed with the user 2026-10-07) ----

[[req]]
id = "I.1"
slice = "I"
title = "Re-index on demand from the cockpit"
acceptance = "From the cockpit (key, leader menu, palette) the user can re-read changed files, rebuild the whole index from scratch (cache dropped), or re-read just the file open in the code view; each goes through the server and the views refresh when it finishes."

[[req]]
id = "I.2"
slice = "I"
title = "Indexing light with progress"
acceptance = "The server announces when indexing starts, its progress (files done of total) and when it finishes (or fails); the top bar shows an INDEX light beside SRV and AGENT that reads 'indexing N of M' while running and, on hover, the last run's time, files read, components and unresolved calls."

[[req]]
id = "I.3"
slice = "I"
title = "Out-of-date markers"
acceptance = "The server tracks files changed on disk since they were last indexed (from the watcher, and by comparing the hash of a file the client opens); the cockpit marks them in the code view (a banner), on the spec's code excerpt, and on graph cards whose code is in such a file."

[[req]]
id = "I.4"
slice = "I"
title = "Never blocking"
acceptance = "While indexing or when something is out of date, every view keeps showing the last good state, marked, with the re-index action offered next to the marker; nothing waits for a sync."

[[req]]
id = "I.5"
slice = "I"
title = "One meaning for index states everywhere"
acceptance = "The index states (up to date, indexing, out of date, failed) have one icon, word and theme colour each, used identically in the top bar, code view, spec and graph."

