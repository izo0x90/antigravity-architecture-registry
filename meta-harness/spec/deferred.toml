# Items deliberately deferred, with why. P10.3 lists these in the final docs.

[[item]]
id = "D.1"
title = "Tamper-proof plans and approvals"
detail = "Plans and approvals live in <repo>/.nah/plans, writable by an agent with a shell. Signing approvals/stage changes with a key outside the repo would reject hand-edited plans, but an agent running as the same OS user could read the key too; real isolation is the harness sandbox's job (no access to ~/.config/nah or the NAH port)."
why = "The user is reworking the workflow after this first version; hardening waits until it settles."
raised = "2026-10-05 re-audit (P8.6)"

