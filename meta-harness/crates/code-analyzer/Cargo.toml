[package]
name = "code-analyzer"
version = "0.1.0"
edition = "2024"
publish = false
description = "Our analyzer: reads each file once with ast-grep by its language pack (definitions, calls, data flow, placeholders, code-rule matches), and links names across files into one result."

[dependencies]
nah-packs = { path = "../nah-packs" }
arch-graph = { version = "0.1.0", path = "../arch-graph" }
ast-grep-config = "0.45.3"
ast-grep-core = "0.45.3"
ast-grep-language = "0.45.3"
# The same tree-sitter ast-grep parses with: highlight queries run on its tree.
tree-sitter = "0.27"
streaming-iterator = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
ignore = "0.4"
rayon = "1"
imbl = "7"
regex = "1"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[features]
# Helpers only the tests use.
testing = []

[dev-dependencies]
code-analyzer = { path = ".", features = ["testing"] }
nah-packs = { path = "../nah-packs", features = ["testing"] }
tempfile = "3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
serde = { version = "1.0", features = ["derive"] }
