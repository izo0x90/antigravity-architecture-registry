[package]
name = "nah-tags"
version = "0.1.0"
edition = "2024"
description = "Tags: names given to things in the project, kept, told on the event stream; the things themselves are the things layer's (nah-things)."

[features]
# An in-memory store, for tests.
testing = []

[dependencies]
httpdate = "1"
harness-contracts = { path = "../harness-contracts" }
harness-core = { path = "../harness-core" }
nah-things = { path = "../nah-things" }
thiserror = "2.0"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
nah-tags = { path = ".", features = ["testing"] }
nah-things = { path = "../nah-things", features = ["testing"] }
tempfile = "3"
serde_json = "1"
