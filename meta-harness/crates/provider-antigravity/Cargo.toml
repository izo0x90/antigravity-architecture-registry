[package]
name = "provider-antigravity"
version = "0.1.0"
edition = "2024"
description = "Google Antigravity harness: ACP flavor, driver and instance"

[dependencies]
harness-contracts = { path = "../harness-contracts" }
harness-core = { path = "../harness-core" }
harness-acp = { path = "../harness-acp" }
workspace-fs = { path = "../workspace-fs" }
async-trait = "0.1.92"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
