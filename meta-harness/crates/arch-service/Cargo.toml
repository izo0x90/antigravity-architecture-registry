[package]
name = "arch-service"
version = "0.1.0"
edition = "2024"
description = "The architecture service: plan and index storage, incremental ingestion, plan operations and checks, approvals, contracts and implementation verification."

[dependencies]
arch-graph = { path = "../arch-graph" }
code-analyzer = { path = "../code-analyzer" }
arch-store = { path = "../arch-store" }
nah-packs = { path = "../nah-packs" }
arch-search = { path = "../arch-search" }
rayon = "1"
memory-stats = { version = "1", features = ["always_use_statm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
ignore = "0.4"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", default-features = false }
scip = "0.10"
protobuf = "3"

[[bench]]
name = "hot"
harness = false
