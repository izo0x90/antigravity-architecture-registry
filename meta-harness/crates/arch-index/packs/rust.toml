# Rust language pack: ast-grep rules mapping Rust syntax onto the generic
# component types. Pure data; the engine has no Rust-specific code.

[language]
name = "rust"
ast_grep = "rust"
extensions = ["rs"]
separator = "::"
call_separators = ["::", "."]
# `a::b` is a module/type path; `a.b` is a member of the value `a`.
path_separators = ["::"]
member_separators = ["."]
reference_markers = ["&", "*"]
glob_import = "*"
package_manifest = "Cargo.toml"
package_name_key = ["package", "name"]
package_name_replace = [["-", "_"]]
source_roots = ["src"]
index_files = ["lib.rs", "mod.rs"]
self_names = ["self", "Self"]
# Leading path segments that mean "relative to here" in qualified calls.
relative_prefixes = ["crate", "super", "self", "Self"]
# Owned and borrowed forms carry the same data.
compatible_types = [["String", "str"], ["PathBuf", "Path"]]
# Which written types carry each JSON Schema type (planned calls are checked
# against real signatures with this).
schema_types = { string = ["String", "str", "char", "PathBuf", "Path"], integer = ["i8", "i16", "i32", "i64", "i128", "isize", "u8", "u16", "u32", "u64", "u128", "usize"], number = ["f32", "f64"], boolean = ["bool"], array = ["Vec", "VecDeque", "HashSet", "BTreeSet"], object = ["HashMap", "BTreeMap"] }
# Words in written types that say nothing about the data, and wrappers that
# make a value optional.
type_noise = ["mut", "dyn", "impl", "const"]
nullable_wrappers = ["Option"]
# Closures may run later or never: calls inside are deferred.
deferred_scopes = ["closure_expression"]
# `extern "C"` is recorded as written, ABI included.
qualifier_tokens = ["async", "unsafe", "const", "extern_modifier"]
qualifier_containers = ["function_modifiers"]
module_type = "module"
identifier_chars = "_"
# Words that can't name a definition.
reserved_words = ["as", "async", "await", "break", "const", "continue", "crate", "dyn", "else", "enum", "extern", "false", "fn", "for", "if", "impl", "in", "let", "loop", "match", "mod", "move", "mut", "pub", "ref", "return", "self", "Self", "static", "struct", "super", "trait", "true", "type", "unsafe", "use", "where", "while", "yield"]
ignored_kinds = ["line_comment", "block_comment"]
import_keywords = ["use", "pub", "as"]

[[definitions]]
type = "function"
rule = { kind = "function_item" }
name_field = "name"
params_field = "parameters"
return_field = "return_type"

[[definitions]]
type = "operation"
rule = { kind = "function_signature_item" }
name_field = "name"
params_field = "parameters"
return_field = "return_type"

[[definitions]]
type = "class"
rule = { any = [{ kind = "struct_item" }, { kind = "enum_item" }, { kind = "union_item" }] }
name_field = "name"

[[definitions]]
type = "interface"
rule = { kind = "trait_item" }
name_field = "name"

[[definitions]]
type = "module"
# Inline `mod x { ... }` only; `mod x;` declares a file module.
rule = { kind = "mod_item", has = { field = "body", kind = "declaration_list" } }
name_field = "name"

# `impl Trait for Type { ... }`: methods belong to Type; Type implements Trait.
[[scopes]]
rule = { kind = "impl_item" }
target_field = "type"
implements_field = "trait"

[[params]]
kind = "parameter"
name_field = "pattern"
type_field = "type"

[[params]]
kind = "self_parameter"

[[calls]]
rule = { kind = "call_expression" }
callee_field = "function"
args_field = "arguments"

[[bindings]]
rule = { kind = "let_declaration" }
name_field = "pattern"
value_field = "value"
type_field = "type"

[[imports]]
rule = { kind = "use_declaration" }

# `use x::shout as yell`
[[aliases]]
rule = { kind = "use_as_clause" }
alias_field = "alias"
original_field = "path"

# Placeholder macros: todo!()/unimplemented!() by name (std::todo!, a
# `use std::todo as later` alias, or a macro defined anywhere in the repo
# that expands to one or to a panic with a not-implemented message).
[macros]
invocation = { kind = "macro_invocation" }
name_field = "macro"
definition = { kind = "macro_definition" }
definition_name_field = "name"
placeholders = ["todo", "unimplemented"]
definition_uses = "(?:[A-Za-z_][A-Za-z0-9_]*::)*([A-Za-z_][A-Za-z0-9_]*)\\s*!"
definition_placeholder = "(?i)\\bpanic\\s*!\\s*\\(\\s*(\\)|\"[^\"]*(not\\s+(yet\\s+)?implemented|todo|unfinished))"

# panic!("not implemented") and the like. unreachable!() is not a
# placeholder: it marks code that can't run, not code still to write.
[[placeholders]]
rule = { kind = "macro_invocation", has = { field = "macro", regex = "^(.*::)?panic$" }, regex = "(?i)(not\\s+(yet\\s+)?implemented|todo)" }

# A function whose body ends by panicking (any message, or none) has no
# real body yet. Functions returning `!` are meant to diverge and don't count.
[[placeholders]]
rule = { kind = "macro_invocation", has = { field = "macro", regex = "^(.*::)?panic$" }, any = [
  { nthChild = { position = 1, reverse = true }, inside = { kind = "block", inside = { kind = "function_item", field = "body", not = { has = { field = "return_type", regex = "^!$" } } } } },
  { inside = { kind = "expression_statement", nthChild = { position = 1, reverse = true }, inside = { kind = "block", inside = { kind = "function_item", field = "body", not = { has = { field = "return_type", regex = "^!$" } } } } } },
] }

# A function named as a value may be called later (a deferred call).
[[references]]
rule = { kind = "identifier", any = [{ inside = { kind = "let_declaration", field = "value" } }, { inside = { kind = "arguments" } }] }

# Constant conditions, for code that can never run. Whatever isn't built
# only from these (a runtime value, a const, a comparison) is undecided and
# its code counts as live: reviewers judge intent beyond that.
[constant_logic]
true_atoms = ["true"]
false_atoms = ["false"]
not_prefixes = ["!"]
and_operators = ["&&"]
or_operators = ["||"]
all_functions = ["all"]
any_functions = ["any"]
not_functions = ["not"]
identity_functions = ["cfg!"]

# Compiled out: the item or statement after a cfg attribute that's always false.
[[dead_code]]
rule = { any = [{ kind = "expression_statement" }, { kind = "let_declaration" }, { kind = "function_item" }, { kind = "impl_item" }, { kind = "mod_item" }, { kind = "block" }], follows = { kind = "attribute_item" } }
condition = { preceding = { kind = "attribute_item" }, capture = "^#\\[\\s*cfg\\s*\\((.*)\\)\\s*\\]$" }

# Never runs: the body of an if or while whose condition is always false.
[[dead_code]]
rule = { kind = "block", any = [{ inside = { kind = "if_expression", field = "consequence" } }, { inside = { kind = "while_expression", field = "body" } }] }
condition = { parent_field = "condition" }

# Never runs: what follows an unconditional return in the same block.
[[dead_code]]
rule = { any = [{ kind = "expression_statement" }, { kind = "let_declaration" }], follows = { stopBy = "end", kind = "expression_statement", has = { kind = "return_expression" } } }
