# Rust language pack: ast-grep rules mapping Rust syntax onto the generic
# component types. Pure data; the engine has no Rust-specific code.

[language]
name = "rust"
ast_grep = "rust"
extensions = ["rs"]
separator = "::"
call_separators = ["::", "."]
# `a::b` is a module/type path; `a.b` is a member of the value `a`.
path_separators = ["::"]
member_separators = ["."]
reference_markers = ["&", "*"]
glob_import = "*"
package_manifest = "Cargo.toml"
package_name_key = ["package", "name"]
package_name_replace = [["-", "_"]]
source_roots = ["src"]
index_files = ["lib.rs", "mod.rs"]
self_names = ["self", "Self"]
# Leading path segments that mean "relative to here" in qualified calls.
relative_prefixes = ["crate", "super", "self", "Self"]
# Owned and borrowed forms carry the same data.
compatible_types = [["String", "str"], ["PathBuf", "Path"]]
# Which written types carry each JSON Schema type (planned calls are checked
# against real signatures with this).
schema_types = { string = ["String", "str", "char", "PathBuf", "Path"], integer = ["i8", "i16", "i32", "i64", "i128", "isize", "u8", "u16", "u32", "u64", "u128", "usize"], number = ["f32", "f64"], boolean = ["bool"], array = ["Vec", "VecDeque", "HashSet", "BTreeSet"], object = ["HashMap", "BTreeMap"] }
# Words in written types that say nothing about the data, and wrappers that
# make a value optional.
type_noise = ["mut", "dyn", "impl", "const"]
nullable_wrappers = ["Option"]
# Closures may run later or never: calls inside are deferred.
deferred_scopes = ["closure_expression"]
qualifier_tokens = ["async", "unsafe", "const"]
qualifier_containers = ["function_modifiers"]

[[definitions]]
type = "function"
rule = { kind = "function_item" }
name_field = "name"
params_field = "parameters"
return_field = "return_type"

[[definitions]]
type = "operation"
rule = { kind = "function_signature_item" }
name_field = "name"
params_field = "parameters"
return_field = "return_type"

[[definitions]]
type = "class"
rule = { any = [{ kind = "struct_item" }, { kind = "enum_item" }, { kind = "union_item" }] }
name_field = "name"

[[definitions]]
type = "interface"
rule = { kind = "trait_item" }
name_field = "name"

[[definitions]]
type = "module"
# Inline `mod x { ... }` only; `mod x;` declares a file module.
rule = { kind = "mod_item", has = { field = "body", kind = "declaration_list" } }
name_field = "name"

# `impl Trait for Type { ... }`: methods belong to Type; Type implements Trait.
[[scopes]]
rule = { kind = "impl_item" }
target_field = "type"
implements_field = "trait"

[[params]]
kind = "parameter"
name_field = "pattern"
type_field = "type"

[[params]]
kind = "self_parameter"

[[calls]]
rule = { kind = "call_expression" }
callee_field = "function"
args_field = "arguments"

[[bindings]]
rule = { kind = "let_declaration" }
name_field = "pattern"
value_field = "value"
type_field = "type"

[[imports]]
rule = { kind = "use_declaration" }

# `use x::shout as yell`
[[aliases]]
rule = { kind = "use_as_clause" }
alias_field = "alias"
original_field = "path"

# todo!() / unimplemented!(), also through a path (std::todo!).
[[placeholders]]
rule = { kind = "macro_invocation", has = { field = "macro", regex = "^(.*::)?(todo|unimplemented)$" } }

# panic!("not implemented") and the like. unreachable!() is not a
# placeholder: it marks code that can't run, not code still to write.
[[placeholders]]
rule = { kind = "macro_invocation", has = { field = "macro", regex = "^(.*::)?panic$" }, regex = "(?i)(not\\s+(yet\\s+)?implemented|todo)" }

# A local macro that expands to todo!()/unimplemented!(): its uses are placeholders.
[[placeholder_aliases]]
rule = { kind = "macro_definition", regex = "\\b(todo|unimplemented)\\s*!" }
name_field = "name"
invocation = { kind = "macro_invocation" }
invocation_name_field = "macro"

# Compiled out: the item or statement after an always-false cfg.
[[dead_code]]
rule = { any = [{ kind = "expression_statement" }, { kind = "let_declaration" }, { kind = "function_item" }, { kind = "impl_item" }, { kind = "mod_item" }], follows = { kind = "attribute_item", regex = "^#\\[cfg\\((any\\(\\s*\\)|false|FALSE)\\)\\]$" } }

# Never runs: the body of `if false`.
[[dead_code]]
rule = { kind = "block", inside = { kind = "if_expression", field = "consequence", has = { field = "condition", regex = "^false$" } } }
