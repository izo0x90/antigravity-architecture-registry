# Python language pack: ast-grep rules mapping Python syntax onto the generic
# component types. Pure data; the engine has no Python-specific code.

[language]
name = "python"
ast_grep = "python"
extensions = ["py"]
separator = "."
call_separators = ["."]
path_separators = ["."]
member_separators = ["."]
glob_import = "*"
index_files = ["__init__.py"]
self_names = ["self", "cls"]
schema_types = { string = ["str"], integer = ["int"], number = ["float"], boolean = ["bool"], array = ["list", "tuple", "set", "List", "Tuple", "Set"], object = ["dict", "Dict"], null = ["None"] }
nullable_wrappers = ["Optional"]
deferred_scopes = ["lambda"]
qualifier_tokens = ["async"]
module_type = "module"
identifier_chars = "_"
ignored_kinds = ["comment"]
import_keywords = ["from", "import", "as"]
source_roots = ["src"]
# `super().m()` calls the base class's m.
super_receivers = ["super()"]
union_separators = ["|"]
null_types = ["None"]

[[definitions]]
type = "function"
rule = { kind = "function_definition" }
name_field = "name"
params_field = "parameters"
return_field = "return_type"

[[definitions]]
type = "class"
rule = { kind = "class_definition" }
name_field = "name"
bases_field = "superclasses"

[[params]]
kind = "identifier"

[[params]]
kind = "typed_parameter"
name_child_kind = "identifier"
type_field = "type"

[[params]]
kind = "default_parameter"
name_field = "name"
optional = true

[[params]]
kind = "typed_default_parameter"
name_field = "name"
type_field = "type"
optional = true

# `*args` / `**kwargs`: any number of arguments, none included.
[[params]]
kind = "list_splat_pattern"
variadic = true

[[params]]
kind = "dictionary_splat_pattern"
variadic = true

[[calls]]
rule = { kind = "call" }
callee_field = "function"
args_field = "arguments"

[[bindings]]
rule = { kind = "assignment" }
name_field = "left"
value_field = "right"
type_field = "type"

[[imports]]
rule = { any = [{ kind = "import_statement" }, { kind = "import_from_statement" }] }

# `import helpers as h`, `from helpers import clean as tidy`
[[aliases]]
rule = { kind = "aliased_import" }
alias_field = "alias"
original_field = "name"

# Never runs: the body of `if False:`.
[[dead_code]]
rule = { kind = "block", inside = { kind = "if_statement", field = "consequence", has = { field = "condition", kind = "false" } } }

[[placeholders]]
rule = { pattern = "raise NotImplementedError" }

[[placeholders]]
rule = { pattern = "raise NotImplementedError($$$ARGS)" }
