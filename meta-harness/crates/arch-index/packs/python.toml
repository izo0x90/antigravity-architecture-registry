# Python language pack: ast-grep rules mapping Python syntax onto the generic
# component types. Pure data; the engine has no Python-specific code.

[language]
name = "python"
ast_grep = "python"
extensions = ["py"]
separator = "."
call_separators = ["."]
path_separators = ["."]
member_separators = ["."]
glob_import = "*"
index_files = ["__init__.py"]
self_names = ["self", "cls"]
schema_types = { string = ["str"], integer = ["int"], number = ["float"], boolean = ["bool"], array = ["list", "tuple", "set", "List", "Tuple", "Set"], object = ["dict", "Dict"], null = ["None"] }
nullable_wrappers = ["Optional"]
deferred_scopes = ["lambda"]
qualifier_tokens = ["async"]
module_type = "module"
identifier_chars = "_"
# Words that can't name a definition.
reserved_words = ["False", "None", "True", "and", "as", "assert", "async", "await", "break", "class", "continue", "def", "del", "elif", "else", "except", "finally", "for", "from", "global", "if", "import", "in", "is", "lambda", "nonlocal", "not", "or", "pass", "raise", "return", "try", "while", "with", "yield"]
ignored_kinds = ["comment"]
import_keywords = ["from", "import", "as"]
# Import text that makes the path relative to the importer's package.
relative_import_markers = ["from ."]
source_roots = ["src"]
# `super().m()` calls the base class's m.
super_receivers = ["super()"]
union_separators = ["|"]
null_types = ["None"]

[[definitions]]
type = "function"
rule = { kind = "function_definition" }
name_field = "name"
params_field = "parameters"
return_field = "return_type"

[[definitions]]
type = "class"
rule = { kind = "class_definition" }
name_field = "name"
bases_field = "superclasses"

[[params]]
kind = "identifier"

[[params]]
kind = "typed_parameter"
name_child_kind = "identifier"
type_field = "type"

[[params]]
kind = "default_parameter"
name_field = "name"
optional = true

[[params]]
kind = "typed_default_parameter"
name_field = "name"
type_field = "type"
optional = true

# `*args` / `**kwargs`: any number of arguments, none included.
[[params]]
kind = "list_splat_pattern"
variadic = true

[[params]]
kind = "dictionary_splat_pattern"
variadic = true

[[calls]]
rule = { kind = "call" }
callee_field = "function"
args_field = "arguments"

[[bindings]]
rule = { kind = "assignment" }
name_field = "left"
value_field = "right"
type_field = "type"

[[imports]]
rule = { any = [{ kind = "import_statement" }, { kind = "import_from_statement" }] }

# `import helpers as h`, `from helpers import clean as tidy`
[[aliases]]
rule = { kind = "aliased_import" }
alias_field = "alias"
original_field = "name"

# Constant conditions, for code that can never run. Anything not built
# only from these (a runtime value, a comparison, a variable) is undecided
# and its code counts as live: reviewers judge intent beyond that.
[constant_logic]
true_atoms = ["True"]
false_atoms = ["False"]
not_prefixes = ["not"]
and_operators = ["and"]
or_operators = ["or"]

# Never runs: the body of an `if` or `while` whose condition is always false.
[[dead_code]]
rule = { kind = "block", any = [{ inside = { kind = "if_statement", field = "consequence" } }, { inside = { kind = "while_statement", field = "body" } }] }
condition = { parent_field = "condition" }

# Never runs: what follows an unconditional return in the same block.
[[dead_code]]
rule = { kind = "expression_statement", follows = { stopBy = "end", kind = "return_statement" } }

[[placeholders]]
rule = { pattern = "raise NotImplementedError" }

[[placeholders]]
rule = { pattern = "raise NotImplementedError($$$ARGS)" }

# A function whose body ends in `...` (alone or after a docstring) has no
# real body yet. Interface stubs don't count: abstract or overload
# declarations, and methods of Protocol classes.
[[placeholders]]
rule = { kind = "ellipsis", inside = { kind = "expression_statement", nthChild = { position = 1, reverse = true }, inside = { kind = "block", inside = { kind = "function_definition", field = "body", not = { any = [
  { inside = { kind = "decorated_definition", has = { kind = "decorator", regex = "abstractmethod|overload" } } },
  { inside = { kind = "class_definition", stopBy = "end", has = { field = "superclasses", regex = "\\bProtocol\\b" } } },
] } } } } }

# `pass` as the whole body of a function that promises a value.
[[placeholders]]
rule = { kind = "pass_statement", all = [{ nthChild = { position = 1 } }, { nthChild = { position = 1, reverse = true } }], inside = { kind = "block", inside = { kind = "function_definition", field = "body", has = { field = "return_type", not = { regex = "^None$" } } } } }
