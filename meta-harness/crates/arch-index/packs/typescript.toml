# TypeScript language pack: ast-grep rules mapping TypeScript syntax onto the
# generic component types. Pure data; the engine has no TypeScript code.

[language]
name = "typescript"
ast_grep = "typescript"
extensions = ["ts", "mts", "cts"]
separator = "."
call_separators = ["."]
path_separators = ["."]
member_separators = ["."]
constructor_prefixes = ["new"]
glob_import = "*"
source_roots = ["src"]
index_files = ["index.ts"]
self_names = ["this"]
schema_types = { string = ["string"], integer = ["number"], number = ["number"], boolean = ["boolean"], array = ["Array"], object = ["Record", "object"], null = ["null", "undefined"] }
# `: string` annotations wrap the type itself.
type_wrappers = ["type_annotation"]
array_suffixes = ["[]"]
# Arrow functions and function expressions may run later or never.
deferred_scopes = ["arrow_function", "function_expression"]
qualifier_tokens = ["async"]
module_type = "module"
identifier_chars = "_$"
ignored_kinds = ["comment"]
import_keywords = ["import", "from", "as", "type", "export"]
super_receivers = ["super"]
union_separators = ["|"]
null_types = ["null", "undefined"]
package_manifest = "package.json"
package_name_key = ["name"]
# .tsx files: the same rules on the TSX grammar.
dialects = [{ ast_grep = "tsx", extensions = ["tsx"] }]

[[definitions]]
type = "function"
rule = { any = [{ kind = "function_declaration" }, { kind = "method_definition" }] }
name_field = "name"
params_field = "parameters"
return_field = "return_type"

# `const f = (x) => ...` / `export const f = async () => ...` at module level:
# a named function. (Inside a function it's a local closure: deferred code.)
[[definitions]]
type = "function"
rule = { kind = "variable_declarator", has = { field = "value", kind = "arrow_function" }, inside = { kind = "lexical_declaration", inside = { any = [{ kind = "program" }, { kind = "export_statement" }] } } }
name_field = "name"
signature_field = "value"
params_field = "parameters"
return_field = "return_type"

[[definitions]]
type = "operation"
rule = { any = [{ kind = "method_signature" }, { kind = "abstract_method_signature" }] }
name_field = "name"
params_field = "parameters"
return_field = "return_type"

[[definitions]]
type = "class"
rule = { any = [{ kind = "class_declaration" }, { kind = "abstract_class_declaration" }] }
name_field = "name"
# `extends Base implements A, B`: each named type is a base.
bases_rule = { any = [
  { kind = "identifier", inside = { kind = "extends_clause" } },
  { kind = "type_identifier", inside = { kind = "implements_clause" } },
] }

[[definitions]]
type = "interface"
rule = { kind = "interface_declaration" }
name_field = "name"
bases_rule = { kind = "type_identifier", inside = { kind = "extends_type_clause" } }

[[params]]
kind = "required_parameter"
name_field = "pattern"
type_field = "type"
# `x = 1`: callers may leave it out.
default_field = "value"

[[params]]
kind = "optional_parameter"
name_field = "pattern"
type_field = "type"
optional = true

[[calls]]
rule = { kind = "call_expression" }
callee_field = "function"
args_field = "arguments"

# `new Greeter()` calls the class (its constructor).
[[calls]]
rule = { kind = "new_expression" }
callee_field = "constructor"
args_field = "arguments"

[[bindings]]
rule = { kind = "variable_declarator" }
name_field = "name"
value_field = "value"
type_field = "type"

[[imports]]
rule = { kind = "import_statement" }

# `import { clean as tidy } from "./helpers"`
[[aliases]]
rule = { kind = "import_specifier", has = { field = "alias", kind = "identifier" } }
alias_field = "alias"
original_field = "name"

# `import * as h from "./helpers"`
[[aliases]]
rule = { kind = "namespace_import" }
alias_child_kind = "identifier"
original_ancestor = "import_statement"
original_field = "source"

# Never runs: the body of `if (false)`.
[[dead_code]]
rule = { kind = "statement_block", inside = { kind = "if_statement", field = "consequence", has = { field = "condition", regex = "^\\(\\s*false\\s*\\)$" } } }

[[placeholders]]
rule = { kind = "throw_statement", regex = "(?i)(todo|not implemented)" }
