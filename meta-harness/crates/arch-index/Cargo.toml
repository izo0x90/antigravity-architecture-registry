[package]
name = "arch-index"
version = "0.1.0"
edition = "2024"
description = "Language-generic code ingestion: language packs (ast-grep rules as data), extraction, call and data-flow resolution into the observed architecture graph, and code rules over components."

[dependencies]
nah-packs = { path = "../nah-packs" }
arch-graph = { version = "0.1.0", path = "../arch-graph" }
ast-grep-config = "0.45.3"
ast-grep-core = "0.45.3"
ast-grep-language = "0.45.3"
serde = { version = "1.0.229", features = ["derive"] }
ignore = "0.4"
regex = "1"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
serde = { version = "1.0", features = ["derive"] }
