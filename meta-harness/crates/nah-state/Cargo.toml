[package]
name = "nah-state"
version = "0.1.0"
edition = "2024"
description = "The project's state database: what the server keeps across restarts that isn't the code's analysis."

[dependencies]
arch-store = { path = "../arch-store" }
harness-contracts = { path = "../harness-contracts" }
harness-core = { path = "../harness-core" }
nah-notify = { path = "../nah-notify" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
