# Shorthand type names for the schema DSL, mapped to JSON Schema types.
# Projects can add aliases. Any other identifier is a reference ($ref) to a
# named data type (a component whose type has properties and no signature).
#
#   "int"        -> {"type": "integer"}
#   "string[]"   -> {"type": "array", "items": {"type": "string"}}
#   "User?"      -> {"anyOf": [{"$ref": "User"}, {"type": "null"}]}
#   {id = "int", note = "string?"} -> object; fields without `?` are required
#
# A map is taken as JSON Schema as is when every key is a JSON Schema keyword
# holding the right kind of value. A record whose fields happen to be named
# like keywords (type, description...) must be written as full schema:
#   {type = "object", properties = {type = "string", description = "string"}}

[primitives]
string = "string"
str = "string"
text = "string"
integer = "integer"
int = "integer"
number = "number"
float = "number"
double = "number"
boolean = "boolean"
bool = "boolean"
object = "object"
any = "any"
null = "null"
