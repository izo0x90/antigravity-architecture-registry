[package]
name = "arch-graph"
version = "0.1.0"
edition = "2024"
description = "Domain model of the architecture graph: generic types, components, relations, plans, views. Pure data and logic, no I/O."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
