[package]
name = "arch-store"
version = "0.1.0"
edition = "2024"
publish = false
description = "Where the analysis is kept between runs: the plan's tables in SQLite, every row belonging to one file. Disposable: the code is the source of truth, so a store that can't be read is made again."

[dependencies]
arch-graph = { path = "../arch-graph" }
code-analyzer = { path = "../code-analyzer" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
