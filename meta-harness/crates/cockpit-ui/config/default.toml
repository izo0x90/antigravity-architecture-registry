focus = "#3ee6ff"
grid = "#3ee6ff12"
text_strong = "#f4f8ff"
text = "#c6d3e3"
muted = "#8a96a8"
faint = "#4f5b6d"
on_bright = "#041016"
accent = "#3ee6ff"
info = "#7cc4ff"
key = "#ffd166"
ok = "#4ade80"
warn = "#fbbf24"
error = "#f87171"
special = "#c084fc"
info_bg = "#0e1c2c"
ok_bg = "#0f2418"
warn_bg = "#241c0c"
error_bg = "#2c1216"
special_bg = "#1c1530"
overlay = "#0b0f17f2"
overlay_raised = "#1d2a3cdc"
highlight = "#3ee6ff1c"
card = "#0f141d"
card_selected = "#0c2630"
card_special = "#141022"
card_special_selected = "#1c1630"
card_ok = "#0e1914"
card_ok_selected = "#12241b"
chrome = "#0b0e14"
widget_selection = "#0b4f5f"
link = "#5fdcff"
# A terminal's 16 named colours (0-7, then bright 8-15).
term_black = "#1a202b"
term_red = "#f87171"
term_green = "#4ade80"
term_yellow = "#fbbf24"
term_blue = "#60a5fa"
term_magenta = "#c084fc"
term_cyan = "#3ee6ff"
term_white = "#c6d3e3"
