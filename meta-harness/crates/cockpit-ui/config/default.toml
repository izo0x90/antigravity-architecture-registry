# NAH UI defaults. A user file served by the server (~/.config/nah/ui.toml, or
# $NAH_UI_CONFIG) is merged over this one: tables merge key by key, anything
# else replaces the default.

[brand]
name = "NAH"
tagline = "not a harness"

[user]
# Your name on review comments, reviews and approvals.
name = "user"

[keymap]
# Tap to open the leader menu (holding it still pans the graph).
leader = "Space"
# Leaves insert mode, steps back out of leader menus, popups and the palette.
back = "Escape"
# Hint labels (`f`) are made of these, best first.
hint_chars = "asdfghjkl"
# How long a half-typed key sequence (g, z, [, ], m, ') waits before a popup
# lists what can follow. Typing the whole sequence quickly never shows it.
which_key_delay_ms = 300
# The leader key for the focused view's own menu (its actions without a
# leader path of their own get the next free keys in it).
view_menu = ","

# The key bar at the bottom: the keys that matter for what the cursor is on.
[keymap.bar]
show = true
# How many keys it shows.
max = 8
# Below this width the keys are big, tappable chips.
narrow_below = 600.0

# Leader submenus, by key path.
[keymap.groups]
b = "Buffer"
l = "Layout"
s = "Session"
m = "Model & config"
o = "Mode"
p = "MCP servers"
h = "Harness commands"
a = "Account"
r = "Requests"
g = "Graph"
e = "Links"
I = "Index"

# Bindings, by action id. Keys:
#   leader: keys after the leader, space separated; "#" is the next free key in
#           that menu.
#   keys:   direct keys in normal mode. A single character matches what is typed
#           ("Y" is shift+y); otherwise modifiers+key, e.g. "ctrl+shift+c", "alt+1".
#           Several keys in one string are a sequence ("g d").
# Actions are looked up by id, then by their aliases, then by wildcard
# ("config.*" covers every id starting with "config.").
#
# One grammar in every view: nav.* keys move the cursor of whatever view has
# focus, goto.* keys take what the cursor is on somewhere else, and a view's
# own keys (graph.*, spec.*, ...) only exist while it has focus. Digits before
# a key are a count (3j, 2ctrl+d) everywhere.
[keymap.bind]
"palette.open" = { leader = "/", keys = [":"] }
"slot.focus.1" = { leader = "1" }
"slot.focus.2" = { leader = "2" }
"slot.focus.3" = { leader = "3" }
"slot.next" = { keys = ["Tab"] }
"slot.prev" = { keys = ["shift+Tab"] }
"buffer.chat" = { leader = "b c" }
"buffer.code" = { leader = "b v" }
"buffer.graph" = { leader = "b g" }
"buffer.tree" = { leader = "b t" }
"buffer.spec" = { leader = "b s" }
"buffer.queue" = { leader = "b q" }
"layout.1" = { leader = "l 1", keys = ["alt+1"] }
"layout.2" = { leader = "l 2", keys = ["alt+2"] }
"layout.3" = { leader = "l 3", keys = ["alt+3"] }
"inspector.toggle" = { leader = "i", keys = ["ctrl+shift+c"] }
"issues.toggle" = { leader = "d", keys = ["F2"] }
"drawer.close" = { leader = "x" }

# Moving the cursor, in every view.
"nav.left" = { keys = ["h"] }
"nav.down" = { keys = ["j"] }
"nav.up" = { keys = ["k"] }
"nav.right" = { keys = ["l"] }
"nav.half_down" = { keys = ["ctrl+d"] }
"nav.half_up" = { keys = ["ctrl+u"] }
"nav.first" = { keys = ["g g"] }
"nav.last" = { keys = ["G"] }
"nav.next_sibling" = { keys = ["] ]"] }
"nav.prev_sibling" = { keys = ["[ ["] }
"nav.enter" = { keys = ["Enter"] }
"nav.leave" = { keys = ["Backspace"] }
# Hints: label what's on screen, type a label to go there (F: and open it).
"nav.hint" = { keys = ["f"] }
"nav.hint_open" = { keys = ["F"] }
# Search the view (/ then type, Enter), next/previous match.
"nav.search" = { keys = ["/"] }
"nav.search_next" = { keys = ["n"] }
"nav.search_prev" = { keys = ["N"] }
# Folds: open, close, toggle, open all, close all.
"nav.fold_open" = { keys = ["z o"] }
"nav.fold_close" = { keys = ["z c"] }
"nav.fold_toggle" = { keys = ["z a"] }
"nav.fold_open_all" = { keys = ["z R"] }
"nav.fold_close_all" = { keys = ["z M"] }
# Marks: m then a letter sets one, ' then the letter jumps back to it (from
# any view).
"nav.mark_set" = { keys = ["m"] }
"nav.mark_jump" = { keys = ["'"] }
# The jump list: back to where a jump left from, and forward again.
"nav.back" = { keys = ["ctrl+o"] }
"nav.forward" = { keys = ["ctrl+i"] }
# This view's keys.
"nav.keys" = { leader = "?", keys = ["?"] }

# Go to, from whatever the cursor is on: its code, spec, place in the graph
# ("map"), outline row, queue job; who calls it, what it calls, what holds
# it, its members, what it implements, where its data flows.
"goto.code" = { keys = ["g d"] }
"goto.spec" = { keys = ["g s"] }
"goto.graph" = { keys = ["g m"] }
"goto.tree" = { keys = ["g t"] }
"goto.queue" = { keys = ["g q"] }
"goto.callers" = { keys = ["g r"] }
"goto.callees" = { keys = ["g c"] }
"goto.parent" = { keys = ["g p"] }
"goto.members" = { keys = ["g n"] }
"goto.implements" = { keys = ["g i"] }
"goto.flows" = { keys = ["g l"] }

"chat.insert" = { keys = ["i"] }
"chat.clear" = { keys = ["x"] }

"session.new" = { leader = "s n" }
"session.resume" = { leader = "s r" }
"session.delete" = { leader = "s d" }
"session.switch" = { leader = "s t" }
"session.stop" = { leader = "s s" }
"session.close" = { leader = "s c" }
"instance.select" = { leader = "s i" }

"config.category.model" = { leader = "m m" }
"config.category.mode" = { leader = "o o" }
"config.*" = { leader = "m #" }
"model.next" = { leader = "m m" }
"mode.native" = { leader = "o o" }
"mode.runtime" = { leader = "o o" }

"mcp.list" = { leader = "p l" }
"mcp.add" = { leader = "p a" }
"mcp.remove" = { leader = "p r" }

"command.*" = { leader = "h #" }

"auth.login" = { leader = "a l" }
"auth.complete" = { leader = "a c" }
"auth.logout" = { leader = "a o" }

# Answering the agent's requests, from any view.
"request.accept" = { leader = "r y", keys = ["y"] }
"request.accept_for_session" = { leader = "r a", keys = ["Y"] }
"request.accept_always" = { leader = "r A", keys = ["A"] }
"request.decline" = { leader = "r n", keys = ["d"] }
"request.cancel" = { leader = "r c" }

# Graph (when focused).
"graph.focus" = { leader = "g f" }
"graph.unfocus" = { leader = "g u" }
"graph.depth_more" = { leader = "g +", keys = ["+"] }
"graph.depth_less" = { leader = "g -", keys = ["-"] }
"graph.view" = { leader = "g v" }
"graph.next_view" = { keys = ["v"] }
"graph.level" = { leader = "g L" }
"graph.coarser" = { leader = "g <", keys = ["<"] }
"graph.finer" = { leader = "g >", keys = [">"] }
"graph.plan" = { leader = "g P" }
"graph.next_call" = { keys = ["] e"] }
"graph.prev_call" = { keys = ["[ e"] }
"graph.zoom_in" = { keys = ["z +"] }
"graph.zoom_out" = { keys = ["z -"] }
"graph.fit" = { leader = "g z", keys = ["z z"] }
"graph.close_inspector" = { leader = "g x", keys = ["x", "Escape"] }
"graph.refresh" = { leader = "g ." }
"graph.legend" = { leader = "g ?", keys = ["g ?"] }
"graph.agent_return" = { leader = "g a", keys = ["g a"] }

# Spec view (when focused). j/k walk every item; J/K (and ]] / [[) jump
# between sections. Review: comment on (or ask for a change to) the item
# under the cursor; on a review point, reply, accept or reopen it.
"spec.next_section" = { keys = ["J"] }
"spec.prev_section" = { keys = ["K"] }
"spec.pin" = { keys = ["p"] }
"spec.comment" = { keys = ["c"] }
"spec.request_change" = { keys = ["C"] }
"spec.reply" = { keys = ["r"] }
"spec.accept" = { keys = ["a"] }
"spec.reopen" = { keys = ["x"] }
"spec.next_point" = { keys = ["] c"] }
"spec.prev_point" = { keys = ["[ c"] }
"spec.mark_reviewed" = { keys = ["R"] }
# Escape leaves the comment field; a second Escape throws the draft away.
"spec.cancel" = { keys = ["Escape"] }

# Queue view: the plan's work, one job per component (Enter shows why a job
# failed).
"queue.approve" = { keys = ["a"] }
"queue.retry" = { keys = ["r"] }
"queue.open_session" = { keys = ["o"] }
"queue.start" = { keys = ["g S"] }
"queue.stop" = { keys = ["g X"] }

# Code view: definitions in order.
"code.next_def" = { keys = ["] f"] }
"code.prev_def" = { keys = ["[ f"] }
"link.follow" = { leader = "e f" }

# Indexing: re-read what changed, rebuild everything, re-read the open file.
"index.changed" = { leader = "I r" }
"index.rebuild" = { leader = "I R" }
"index.file" = { leader = "I f" }

# Colors by role: "#rrggbb" or "#rrggbbaa".
# Sizes, in points: text, the spacing scale, corners, lines, and effects.
# Views use these names, never numbers of their own.
[look]
text_tiny = 9.0
text_small = 10.0
text_body = 11.0
text_label = 12.0
text_title = 13.0
text_heading = 14.0
text_display = 16.0
space_hair = 1.0
space_xs = 2.0
space_s = 4.0
space_sm = 6.0
space_m = 8.0
space_ml = 10.0
space_l = 12.0
space_xl = 16.0
space_xxl = 24.0
space_xxxl = 32.0
space_huge = 48.0
radius_s = 3.0
radius_m = 4.0
radius_l = 6.0
radius_xl = 8.0
radius_pill = 16.0
line_thin = 1.0
line_bold = 2.0
# The selection's glow (points wide, and strength 0 to 1).
glow_width = 6.0
glow_alpha = 0.35
# One beat of the pulse where the agent points, in seconds.
pulse_seconds = 1.6
# Planned connections' dashes move this many points a second (0: still).
dash_speed = 18.0
# How much what's not selected fades back (0 to 1).
fade = 0.6
# Background grid spacing in the graph (0: none).
grid_step = 32.0
# With something selected, how far what isn't related to it dims (0 to 1).
dim = 0.78
# Merged lines grow with how many relations they stand for: this much of
# their width per doubling, up to this many times as wide.
line_count_gain = 0.5
line_count_max = 3.0
# How long cards take to move, and going into or out of a level, in seconds (0: at once).
move_seconds = 0.35

# Colors by role: "#rrggbb" or "#rrggbbaa". A deep background, one electric
# accent kept for focus and selection, and status colors used for status only.
[theme]
bg = "#080a0f"
panel = "#0b0e14"
surface = "#10141c"
raised = "#182030"
selection = "#0d2f3a"
border = "#1a202b"
border_strong = "#283244"
focus = "#3ee6ff"
grid = "#3ee6ff12"
text_strong = "#f4f8ff"
text = "#c6d3e3"
muted = "#8a96a8"
faint = "#4f5b6d"
on_bright = "#041016"
accent = "#3ee6ff"
info = "#7cc4ff"
key = "#ffd166"
ok = "#4ade80"
warn = "#fbbf24"
error = "#f87171"
special = "#c084fc"
info_bg = "#0e1c2c"
ok_bg = "#0f2418"
warn_bg = "#241c0c"
error_bg = "#2c1216"
special_bg = "#1c1530"
overlay = "#0b0f17f2"
overlay_raised = "#1d2a3cdc"
highlight = "#3ee6ff1c"
card = "#0f141d"
card_selected = "#0c2630"
card_special = "#141022"
card_special_selected = "#1c1630"
card_ok = "#0e1914"
card_ok_selected = "#12241b"
chrome = "#0b0e14"
widget_selection = "#0b4f5f"
link = "#5fdcff"

# How each state looks wherever it's shown: a word, an icon (by name) and a
# theme colour (token name from [theme]). Views never colour a state alone.
[status.index_fresh]
word = "up to date"
icon = "check-circle"
color = "ok"

[status.indexing]
word = "indexing"
icon = "arrows-clockwise"
color = "info"

[status.stale]
word = "out of date"
icon = "clock-counter-clockwise"
color = "warn"

[status.index_failed]
word = "indexing failed"
icon = "warning-octagon"
color = "error"

# Plan against code.
[status.observed]
word = "in code (no plan)"
icon = "code"
color = "muted"

[status.planned]
word = "planned, not built yet"
icon = "circle-dashed"
color = "warn"

[status.missing]
word = "planned, missing in code"
icon = "warning-circle"
color = "error"

[status.present]
word = "planned and in code"
icon = "seal-check"
color = "ok"

# Review and work.
[status.placeholders]
word = "placeholders"
icon = "hourglass"
color = "warn"

[status.open_comments]
word = "open comments"
icon = "chat-circle-dots"
color = "warn"

[status.unconfirmed]
word = "unconfirmed flow (the types don't confirm it)"
icon = "question"
color = "warn"

[status.reshapes]
word = "reshapes the data"
icon = "shuffle"
color = "special"

[status.following]
word = "following"
icon = "path"
color = "focus"

[status.changed]
word = "changed since review"
icon = "pencil-simple"
color = "info"

[status.required_missing]
word = "required, missing"
icon = "flag"
color = "error"

# Stages, in order.
[status.stage_declared]
word = "declared"
icon = "lightbulb"
color = "faint"

[status.stage_arch_approved]
word = "architecture approved"
icon = "check-circle"
color = "info"

[status.stage_plan_approved]
word = "plan approved"
icon = "list-checks"
color = "accent"

[status.stage_skeleton]
word = "skeleton"
icon = "stack"
color = "warn"

[status.stage_implemented]
word = "implemented"
icon = "seal-check"
color = "ok"

# Queue jobs.
[status.job_queued]
word = "queued"
icon = "circle"
color = "muted"

[status.job_running]
word = "running"
icon = "play"
color = "info"

[status.job_awaiting_approval]
word = "needs your approval"
icon = "hand"
color = "warn"

[status.job_retrying]
word = "retrying"
icon = "arrows-clockwise"
color = "warn"

[status.job_failed]
word = "failed"
icon = "x-circle"
color = "error"

[status.job_done]
word = "done"
icon = "check-circle"
color = "ok"

# Finding severities.
[status.severity_error]
word = "error"
icon = "warning-octagon"
color = "error"

[status.severity_warning]
word = "warning"
icon = "warning"
color = "warn"

[status.severity_info]
word = "note"
icon = "eye"
color = "muted"

# How the graph looks. Colors are theme token names (from [theme] above).
[graph_style.kinds]
contains = "faint"
implements = "special"
calls = "accent"
data_flow = "info"

# Relation lines by how plan and code line up. Without `color`, a line takes
# its kind's color.
[graph_style.edges]
observed = { width = 1.4 }
planned = { width = 1.4, dashed = true }
missing = { color = "error", width = 1.8, dashed = true }
present = { width = 1.6 }

# A data flow the code shows but the types can't confirm (mismatched or
# missing types).
[graph_style.unconfirmed]
color = "warn"
width = 1.2
dashed = true

# Width multipliers by where a relation is known from.
[graph_style.provenance]
observed = 1.0
planned = 1.0
both = 1.3

# Overlay relations (drawn over a view's own kinds) are lighter.
[graph_style.overlay]
width = 0.65
alpha = 0.6

[graph_style.nodes]
outline = { observed = { color = "border_strong", width = 1.2 }, planned = { color = "warn", width = 1.2, dashed = true }, missing = { color = "error", width = 1.6 }, present = { color = "ok", width = 1.4 } }
selected_outline = "focus"
selected_width = 2.5
fill = "card"
selected_fill = "card_selected"
# A stripe on the card's left edge by lifecycle stage.
stages = { declared = "faint", arch_approved = "info", plan_approved = "accent", skeleton = "warn", implemented = "ok" }
# Ring around the node the agent pointed at.
agent = "special"

# How the graph behaves.
[graph]
# Long-press a node: these actions (the ones that apply) as chips.
context = ["graph.focus", "goto.spec", "goto.code", "goto.callees", "goto.callers", "goto.parent", "goto.members", "goto.implements", "goto.flows"]

[graph.touch]
# Points a finger may wander and still tap or long-press.
tap_slop = 12.0
double_tap_ms = 320.0
long_press_ms = 550.0
# A swipe (back/forward in the jump list) is a quick horizontal flick at least this long.
swipe_min = 90.0
swipe_max_ms = 450.0

# On-screen chips: "auto" (narrow screens, or after a touch), "always" or "never".
[graph.chips]
show = "auto"
narrow_below = 480.0
size = 32.0
actions = ["nav.back", "nav.forward", "graph.fit", "graph.zoom_in", "graph.zoom_out", "graph.next_view", "nav.hint_open", "graph.legend"]

# Semantic zoom: card detail by zoom level. Below `mid`: the name; from `mid`:
# type, stage and location; from `near`: signature, alignment, placeholders
# and review points. Text keeps its size at every zoom: a card shows the
# lines that fit it, and below the name's own size its label floats over it.
[graph.detail]
mid = 0.85
near = 1.3

# How the graph is arranged. Positions and sizes snap to half of `grid`;
# `gap_x` / `gap_y` between columns and between cards; `pad` inside cards and
# open modules; `header` an open module's title band; `column` most cards in a
# column before it wraps; `lane` how far apart lines run (and the step they're
# routed on); `bend` what a turn costs a route, in lanes; card width limits;
# and how wide text is (glyph width and line height as shares of font size).
[graph.arrange]
grid = 32.0
gap_x = 96.0
gap_y = 32.0
pad = 16.0
header = 32.0
column = 12
lane = 16.0
bend = 3.0
card_min_w = 96.0
card_max_w = 320.0
char_width = 0.6
line_height = 1.4

# Levels: zooming in until a shut module fills `enter_fill` of the view goes
# into it; zooming out until the level fills less than `leave_fill` goes up to
# the one above. A level with more than `max_cards` parts shows the
# selection's neighbourhood and holds the rest in "+N more".
[graph.levels]
enter_fill = 0.5
leave_fill = 0.25
max_cards = 60
# Most markers at the screen's edge naming where the selection's lines go
# off screen; the rest are summed up in one ("+N more off screen").
max_markers = 14

# The event socket: when it drops, try again after `reconnect_min_ms`, doubling
# up to `reconnect_max_ms`; views refetch once it's back.
[net]
reconnect_min_ms = 500
reconnect_max_ms = 10000

# Follow mode (link.follow): the graph selects the code cursor's component
# once the cursor has rested this long.
[links]
follow_debounce_ms = 250

# Presets: whole looks you can switch to with one setting at the top of your
# UI config, e.g. `preset = "classic"`. A preset's sections are laid over the
# rest (only what it sets changes).

[presets.classic.theme]
bg = "#0c0e12"
panel = "#0e1117"
surface = "#12161e"
raised = "#1e2d41"
selection = "#233755"
border = "#1e2430"
border_strong = "#2d374b"
focus = "#508cdc"
grid = "#6a88bf3c"
text_strong = "#ffffff"
text = "#c8d7e6"
muted = "#a0a5af"
faint = "#5a6e87"
on_bright = "#000000"
accent = "#64a0f0"
info = "#8cc8ff"
key = "#ffd700"
ok = "#50c878"
warn = "#fab432"
error = "#f05050"
special = "#b478ff"
info_bg = "#141e30"
ok_bg = "#14301e"
warn_bg = "#241e12"
error_bg = "#3c1418"
special_bg = "#201c30"
overlay = "#111621f5"
overlay_raised = "#29384fdc"
highlight = "#fab43223"
card = "#12161e"
card_selected = "#182230"
card_special = "#161320"
card_special_selected = "#201c30"
card_ok = "#121a16"
card_ok_selected = "#1a241e"
chrome = "#1b1b1b"
widget_selection = "#005c80"
link = "#5aaaff"

# How each state looks wherever it's shown: a word, an icon (by name) and a
# theme colour (token name from [theme]). Views never colour a state alone.
