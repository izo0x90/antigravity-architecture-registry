# NAH UI defaults. A user file served by the server (~/.config/nah/ui.toml, or
# $NAH_UI_CONFIG) is merged over this one: tables merge key by key, anything
# else replaces the default.

[brand]
name = "NAH"
tagline = "not a harness"

[user]
# Your name on reviews and approvals.
name = "user"

[keymap]
# Tap to open the leader menu (holding it still pans the graph).
leader = "Space"
# Leaves insert mode, steps back out of leader menus, popups and the palette.
back = "Escape"
# The quick look's key (quicklook.toggle) held at least this long is a peek:
# the quick look closes when it's let go. Tapped, it stays open until Escape
# or the key again.
peek_hold_ms = 250
# Hint labels (`f`) are made of these, best first.
hint_chars = "asdfghjkl"
# How long a half-typed key sequence (g, z, [, ], m, ') waits before a popup
# lists what can follow. Typing the whole sequence quickly never shows it.
which_key_delay_ms = 300
# The leader key for the focused view's own menu (its actions without a
# leader path of their own get the next free keys in it).
view_menu = ","

# Touch gestures (every view): how far a finger may wander and still
# long-press, the long press time, and what's a swipe (a quick sideways
# flick at least this long). What a swipe does is bound in [keymap.bind]
# like a key (`gestures = ["swipe_left"]`). Taps, drags and two fingers are
# the pointer's, as with a mouse.
[touch]
# Points a finger may wander and still long-press.
tap_slop = 12.0
long_press_ms = 550.0
swipe_min = 90.0
swipe_max_ms = 450.0

# Moving and picking in every list (the palette, its pickers).
[keymap.list]
next = ["ctrl+j", "ctrl+n", "ArrowDown"]
prev = ["ctrl+k", "ctrl+p", "ArrowUp"]
pick = ["Enter"]
# While a value is picked: what it's for, the next of its kinds (tagging:
# the line, or the command it's in).
cycle = ["Tab"]

# Every typing box: send, (in the chat) add to what it's doing, and a new line.
[keymap.input]
send = ["Enter"]
add = ["ctrl+Enter"]
newline = "shift+Enter"     # a new line in the box
# Leaving typing in a terminal, where Escape is the program's (vim's): each
# a key sequence. The first key of one waits for the next; past the wait it
# goes to the program after all (`ctrl+\` too, which would stop it).
leave = ["Escape Escape", "ctrl+\\ n"]
leave_wait_ms = 300

# Held with the pointer (ctrl is Cmd on a Mac): clicking a name in the code
# goes to what it names; turning the wheel zooms where a view zooms (the
# graph; a trackpad's pinch zooms too).
[keymap.pointer]
go_to = "ctrl"
zoom = "ctrl"

# The key bar at the bottom: the keys that matter for what the cursor is on.
[keymap.bar]
show = true
# How many keys it shows.
max = 8
# Below this width the keys are big, tappable chips.
narrow_below = 600.0

# Leader submenus, by key path.
[keymap.groups]
b = "Buffer"
"b n" = "New buffer"
l = "Panels"
q = "Quick look"
s = "Session"
w = "Agent slots"
S = "Servers"
m = "Model & config"
o = "Mode"
p = "Tools & skills"
h = "Harness commands"
a = "Account"
r = "Requests"
g = "Graph"
e = "Links"
I = "Index"
D = "Developer"
k = "Tags"

# Bindings, by action id. Keys:
#   leader: keys after the leader, space separated; "#" is the next free key in
#           that menu.
#   keys:   direct keys in normal mode. A single character matches what is typed
#           ("Y" is shift+y); otherwise modifiers+key, e.g. "ctrl+shift+c", "alt+1".
#           Several keys in one string are a sequence ("g d").
# Actions are looked up by id, then by their aliases, then by wildcard
# ("config.*" covers every id starting with "config.").
#
# One grammar in every view: nav.* keys move the cursor of whatever view has
# focus, goto.* keys take what the cursor is on somewhere else, and a view's
# own keys (graph.*, spec.*, ...) only exist while it has focus. Digits before
# a key are a count (3j, 2ctrl+d) everywhere.
[keymap.bind]
"palette.open" = { leader = "/", keys = [":"] }
"panel.focus.1" = { leader = "1" }
"panel.focus.2" = { leader = "2" }
"panel.focus.3" = { leader = "3" }
"panel.focus.4" = { leader = "4" }
"panel.focus.5" = { leader = "5" }
"panel.focus.6" = { leader = "6" }
"panel.next" = { keys = ["Tab", "L"] }
"panel.prev" = { keys = ["shift+Tab", "H"] }
"buffer.chat" = { leader = "b c" }
"buffer.code" = { leader = "b v" }
"buffer.graph" = { leader = "b g" }
"buffer.tree" = { leader = "b t" }
"buffer.spec" = { leader = "b s" }
"buffer.queue" = { leader = "b q" }
"buffer.inbox" = { leader = "b i" }
"buffer.changes" = { leader = "b f" }
"buffer.terminal" = { leader = "b r" }
"buffer.tags" = { leader = "b T" }
"buffer.plan" = { leader = "b p" }
# Every open buffer (on screen or hidden), to show in this panel; a new one
# here; this panel's buffer deleted for good (closing a panel only hides it).
"buffer.list" = { leader = "b b" }
"buffer.delete" = { leader = "b d" }
"buffer.new.code" = { leader = "b n v" }
"buffer.new.graph" = { leader = "b n g" }
"buffer.new.tree" = { leader = "b n t" }
"buffer.new.spec" = { leader = "b n s" }
"buffer.new.chat" = { leader = "b n c" }
"buffer.new.terminal" = { leader = "b n r" }
"layout.1" = { leader = "l 1", keys = ["alt+1"] }
"layout.2" = { leader = "l 2", keys = ["alt+2"] }
"layout.3" = { leader = "l 3", keys = ["alt+3"] }
"layout.4" = { leader = "l 4", keys = ["alt+4"] }
"layout.5" = { leader = "l 5", keys = ["alt+5"] }
"layout.6" = { leader = "l 6", keys = ["alt+6"] }
"panel.add" = { leader = "l a" }
"panel.close" = { leader = "l x" }
"panel.item_buttons" = { leader = "l b" }
"inspector.toggle" = { leader = "D i", keys = ["ctrl+shift+c"] }
"issues.toggle" = { leader = "D d", keys = ["F2"] }
# The quick look: the full card of what the cursor is on, over the view
# (hold to peek, tap to keep it open), and the same card sent to a panel.
"quicklook.toggle" = { leader = "q q", keys = ["q"] }
"quicklook.to_panel" = { leader = "q c" }
# A box over whatever is on screen for talking to the agent (Enter sends,
# Escape closes).
"talk.open" = { leader = "t", keys = ["t"] }
"terminal.popup" = { leader = "T", keys = ["ctrl+`"] }
"cockpit.agents" = { leader = "w d" }

# Moving the cursor, in every view.
"nav.left" = { keys = ["h"] }
"nav.down" = { keys = ["j"] }
"nav.up" = { keys = ["k"] }
"nav.right" = { keys = ["l"] }
"nav.half_down" = { keys = ["ctrl+d"] }
"nav.half_up" = { keys = ["ctrl+u"] }
# Sideways, in views wider than their window: half a window, or a few
# columns (vim's z H / z L and z h / z l work too).
"nav.half_left" = { keys = ["ctrl+h", "z H"] }
"nav.half_right" = { keys = ["ctrl+l", "z L"] }
"nav.few_left" = { keys = ["z h"] }
"nav.few_right" = { keys = ["z l"] }
"nav.first" = { keys = ["g g"] }
"nav.last" = { keys = ["G"] }
"nav.next_sibling" = { keys = ["] ]"] }
"nav.prev_sibling" = { keys = ["[ ["] }
"nav.enter" = { keys = ["Enter"] }
"nav.leave" = { keys = ["Backspace"] }
# Hints: label what's on screen, type a label to go there (F: and open it).
"nav.hint" = { keys = ["f"] }
"nav.hint_open" = { keys = ["F"] }
# Search the view (/ then type, Enter), next/previous match.
"nav.search" = { keys = ["/"] }
"nav.search_next" = { keys = ["n"] }
"nav.search_prev" = { keys = ["N"] }
# Folds: open, close, toggle, open all, close all.
"nav.fold_open" = { keys = ["z o"] }
"nav.fold_close" = { keys = ["z c"] }
"nav.fold_toggle" = { keys = ["z a"] }
"nav.fold_open_all" = { keys = ["z R"] }
"nav.fold_close_all" = { keys = ["z M"] }
# Marks: m then a letter sets one, ' then the letter jumps back to it (from
# any view).
"nav.mark_set" = { keys = ["m"] }
"nav.mark_jump" = { keys = ["'"] }
# Discussions: ask about (or ask for a change to) what you're on (Tab
# picks the next of the things there; then what it is, then what it says).
"discuss.start" = { keys = ["C"] }
# Tags: tag what you're on (pick a tag or name a new one), go to something
# tagged, step through the rest of what its tag is on.
"tag.add" = { keys = ["M"] }
"tag.goto" = { keys = ["g T"] }
"tag.next" = { keys = ["] t"] }
"tag.prev" = { keys = ["[ t"] }
# The tags at the cursor (in any view; in the Tags view, its row's): rename,
# colour, note, clear the note, delete (the Tags view only), take off.
"tag.rename" = { leader = "k r" }
"tag.recolour" = { leader = "k c" }
"tag.note" = { leader = "k n" }
"tag.note_clear" = { leader = "k x" }
"tag.delete" = { leader = "k d" }
"tag.remove" = { leader = "k o" }
# The jump list: back to where a jump left from, and forward again.
"nav.back" = { keys = ["ctrl+o"], gestures = ["swipe_right"] }
"nav.forward" = { keys = ["ctrl+i"], gestures = ["swipe_left"] }
# This view's keys.
"nav.keys" = { leader = "?", keys = ["?"] }

# Go to, from whatever the cursor is on: its code, spec, place in the graph
# ("map"), outline row, queue job; every use of it, who calls it, what it calls, what holds
# it, its members, what it implements, where its data flows.
"goto.code" = { keys = ["g d"] }
"goto.spec" = { keys = ["g s"] }
"goto.graph" = { keys = ["g m"] }
"goto.tree" = { keys = ["g t"] }
"goto.queue" = { keys = ["g q"] }
"goto.changes" = { keys = ["g x"] }
"goto.uses" = { keys = ["g r"] }
"goto.callers" = { keys = ["g R"] }
"goto.callees" = { keys = ["g c"] }
"goto.parent" = { keys = ["g p"] }
"goto.members" = { keys = ["g n"] }
"goto.implements" = { keys = ["g i"] }
"goto.flows" = { keys = ["g l"] }

"chat.insert" = { keys = ["i"] }
"chat.clear" = { keys = ["x"] }
"chat.next_slot" = { keys = ["J"], gestures = ["swipe_left"] }
"chat.prev_slot" = { keys = ["K"], gestures = ["swipe_right"] }

"session.new" = { leader = "s n" }
"session.resume" = { leader = "s r" }
"session.delete" = { leader = "s d" }
"session.switch" = { leader = "s t" }
"session.stop" = { leader = "s s" }
"chat.inject" = { leader = "s a" }
"session.close" = { leader = "s c" }
"instance.select" = { leader = "s i" }

"attention.next_waiting" = { leader = "n" }
"attention.waiting" = { leader = "N" }
"attention.updates" = { leader = "u" }
# The inbox's own (in a panel or the quick look): the next and previous
# item (on whichever server), its chat, put away; y/Y/A/d (or r 1, r 2…
# when several answers are of one kind) answer its request.
"inbox.next" = { keys = ["J"], gestures = ["swipe_left"] }
"inbox.prev" = { keys = ["K"], gestures = ["swipe_right"] }
"inbox.open_chat" = { keys = ["o"] }
"inbox.dismiss" = { keys = ["x"] }
# A terminal's own (not typing: typing, every key is its program's): type
# into it, copy the selection (or the cursor's line: y and Y answer requests
# everywhere), its neighbours.
"terminal.type" = { keys = ["i"] }
"terminal.copy" = { keys = ["c"] }
"terminal.next" = { keys = ["J"], gestures = ["swipe_left"] }
"terminal.prev" = { keys = ["K"], gestures = ["swipe_right"] }

"server.switch" = { leader = "S S" }
"server.add" = { leader = "S a" }
"server.connect" = { leader = "S c" }
"server.disconnect" = { leader = "S d" }
"server.remove" = { leader = "S r" }
"server.shutdown" = { leader = "S x" }

"agent.pick" = { leader = "w w" }
"agent.new" = { leader = "w n" }
"agent.close" = { leader = "w c" }

"config.category.model" = { leader = "m m" }
"config.category.mode" = { leader = "o o" }
"config.*" = { leader = "m #" }
"model.next" = { leader = "m m" }
"mode.native" = { leader = "o o" }
"mode.runtime" = { leader = "o o" }

"mcp.list" = { leader = "p l" }
"mcp.add" = { leader = "p a" }
"mcp.remove" = { leader = "p r" }
"harness.skills" = { leader = "p s" }

"command.*" = { leader = "h #" }

"auth.login" = { leader = "a l" }
"auth.complete" = { leader = "a c" }
"auth.logout" = { leader = "a o" }

# Answering the agent's requests, from any view.
"request.accept" = { leader = "r y", keys = ["y"] }
"request.accept_for_session" = { leader = "r a", keys = ["Y"] }
"request.accept_always" = { leader = "r A", keys = ["A"] }
"request.decline" = { leader = "r n", keys = ["d"] }
"request.cancel" = { leader = "r c" }
# Several answers of one kind (a question's): numbered under r.
"request.*" = { leader = "r #" }

# Graph (when focused). Select with the moves (h j k l), open or close a
# card with the folds (z o, z c), go in with Enter, back with Backspace.
"graph.go_in" = { leader = "g f", keys = ["g f"] }
"graph.depth_more" = { leader = "g +", keys = ["+"] }
"graph.depth_less" = { leader = "g -", keys = ["-"] }
"graph.flip" = { leader = "g r", keys = ["r"] }
"graph.view" = { leader = "g v", keys = ["v"] }
"graph.plan" = { leader = "g P" }
"graph.full_code" = { leader = "g F" }
"graph.agent_return" = { leader = "g a", keys = ["g a"] }
"graph.find" = { leader = "g /", keys = ["g /"] }
"graph.zoom_in" = { leader = "g i", keys = ["i"] }
"graph.zoom_out" = { leader = "g o", keys = ["o"] }
"graph.fit" = { leader = "g z", keys = ["z z"] }
"graph.fit_card" = { leader = "g Z", keys = ["z f"] }

# Spec view (when focused). j/k walk every item; J/K (and ]] / [[) jump
# between sections. Its discussions: ] c / [ c step through those not
# settled, Enter opens one (C starts one, as anywhere).
"spec.next_section" = { keys = ["J"] }
"spec.prev_section" = { keys = ["K"] }
"spec.pin" = { keys = ["p"] }
"spec.next_point" = { keys = ["] c"] }
"spec.prev_point" = { keys = ["[ c"] }
"spec.mark_reviewed" = { keys = ["R"] }

# A discussion (when focused): reply, settle it (accept its answer), reopen
# it (say why), make it a change request. Escape stops writing.
"discussion.reply" = { keys = ["r"] }
"discussion.settle" = { keys = ["a"] }
"discussion.reopen" = { keys = ["x"] }
"discussion.change" = { keys = ["c"] }

# Queue view: the plan's work, one job per component (Enter shows why a job
# failed).
"queue.approve" = { keys = ["a"] }
"queue.retry" = { keys = ["r"] }
"queue.open_session" = { keys = ["o"] }
"queue.start" = { keys = ["g S"] }
"queue.stop" = { keys = ["g X"] }

# Code view: definitions in order.
"code.next_def" = { keys = ["] f"] }
"code.prev_def" = { keys = ["[ f"] }
"code.deleted" = { keys = ["z d"] }

# Indexing: re-read what changed, rebuild everything, re-read the open file.
"index.changed" = { leader = "I r" }
"index.rebuild" = { leader = "I R" }
"index.file" = { leader = "I f" }

# Colors by role: "#rrggbb" or "#rrggbbaa".
# Sizes, in points: text, the spacing scale, corners, lines, and effects.
# Views use these names, never numbers of their own.
[look]
text_tiny = 9.0
text_small = 10.0
text_body = 11.0
text_label = 12.0
text_title = 13.0
text_heading = 14.0
text_display = 16.0
space_hair = 1.0
space_xs = 2.0
space_s = 4.0
space_sm = 6.0
space_m = 8.0
space_ml = 10.0
space_l = 12.0
space_xl = 16.0
space_xxl = 24.0
space_xxxl = 32.0
space_huge = 48.0
radius_s = 3.0
radius_m = 4.0
radius_l = 6.0
radius_xl = 8.0
radius_pill = 16.0
line_thin = 1.0
line_bold = 2.0
# The selection's glow (points wide, and strength 0 to 1).
glow_width = 6.0
glow_alpha = 0.35
# One beat of the pulse where the agent points, in seconds.
pulse_seconds = 1.6
# Planned connections' dashes move this many points a second (0: still).
dash_speed = 18.0
# How much what's not selected fades back (0 to 1).
fade = 0.6
# Background grid spacing in the graph (0: none).
grid_step = 32.0
# With something selected, how far what isn't related to it dims (0 to 1).
dim = 0.78
# Merged lines grow with how many relations they stand for: this much of
# their width per doubling, up to this many times as wide.
line_count_gain = 0.5
line_count_max = 3.0
# How long cards take to move, and going into or out of a level, in seconds (0: at once).
move_seconds = 0.35
# The quick look: at least this wide (its panel's width, when wider), and
# this share of the screen's height.
quick_look_width = 720.0
quick_look_height = 0.8
# The gutter of notes beside what a view draws: a tag's bar this wide,
# bars this far apart, a discussion's mark this big.
gutter_bar = 2.5
gutter_gap = 1.5
gutter_mark = 11.0

