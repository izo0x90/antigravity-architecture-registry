term_bright_red = "#fca5a5"
term_bright_green = "#86efac"
term_bright_yellow = "#fde68a"
term_bright_blue = "#93c5fd"
term_bright_magenta = "#d8b4fe"
term_bright_cyan = "#a5f3fc"
term_bright_white = "#f4f8ff"
# Tags' colours (a tag is one, by its number).
