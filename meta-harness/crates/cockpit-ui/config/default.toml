# NAH UI defaults. A user file served by the server (~/.config/nah/ui.toml, or
# $NAH_UI_CONFIG) is merged over this one: tables merge key by key, anything
# else replaces the default.

[brand]
name = "NAH"
tagline = "not a harness"

[user]
# Your name on review comments, reviews and approvals.
name = "user"

[keymap]
# Tap to open the leader menu (holding it still pans the graph).
leader = "Space"
# Leaves insert mode, steps back out of leader menus and the palette.
back = "Escape"
# Hint labels (graph `f`) are made of these, best first.
hint_chars = "asdfghjkl"

# Leader submenus, by key path.
[keymap.groups]
b = "Buffer"
l = "Layout"
s = "Session"
m = "Model & config"
o = "Mode"
p = "MCP servers"
h = "Harness commands"
a = "Account"
r = "Requests"
g = "Graph"
e = "Code links"

# Bindings, by action id. Keys:
#   leader: keys after the leader, space separated; "#" is the next free key in
#           that menu.
#   keys:   direct keys in normal mode. A single character matches what is typed
#           ("Y" is shift+y); otherwise modifiers+key, e.g. "ctrl+shift+c", "alt+1".
# Actions are looked up by id, then by their aliases, then by wildcard
# ("config.*" covers every id starting with "config.").
[keymap.bind]
"palette.open" = { leader = "/", keys = [":"] }
"slot.focus.1" = { leader = "1", keys = ["1"] }
"slot.focus.2" = { leader = "2", keys = ["2"] }
"slot.focus.3" = { leader = "3", keys = ["3"] }
"slot.next" = { keys = ["Tab"] }
"slot.prev" = { keys = ["shift+Tab"] }
"buffer.chat" = { leader = "b c", keys = ["c"] }
"buffer.code" = { leader = "b v", keys = ["v"] }
"buffer.graph" = { leader = "b g", keys = ["g"] }
"buffer.tree" = { leader = "b t", keys = ["t"] }
"layout.1" = { leader = "l 1", keys = ["alt+1"] }
"layout.2" = { leader = "l 2", keys = ["alt+2"] }
"layout.3" = { leader = "l 3", keys = ["alt+3"] }
"inspector.toggle" = { leader = "i", keys = ["ctrl+shift+c"] }
"issues.toggle" = { leader = "d", keys = ["F2"] }
"drawer.close" = { leader = "x" }

"chat.insert" = { keys = ["i"] }
"chat.clear" = { keys = ["x"] }

"session.new" = { leader = "s n" }
"session.resume" = { leader = "s r" }
"session.delete" = { leader = "s d" }
"session.switch" = { leader = "s t" }
"session.stop" = { leader = "s s" }
"session.close" = { leader = "s c" }
"instance.select" = { leader = "s i" }

"config.category.model" = { leader = "m m" }
"config.category.mode" = { leader = "o o" }
"config.*" = { leader = "m #" }
"model.next" = { leader = "m m" }
"mode.native" = { leader = "o o" }
"mode.runtime" = { leader = "o o" }

"mcp.list" = { leader = "p l" }
"mcp.add" = { leader = "p a" }
"mcp.remove" = { leader = "p r" }

"command.*" = { leader = "h #" }

"auth.login" = { leader = "a l" }
"auth.complete" = { leader = "a c" }
"auth.logout" = { leader = "a o" }

"request.accept" = { leader = "r y", keys = ["y"] }
"request.accept_for_session" = { leader = "r a", keys = ["Y"] }
"request.accept_always" = { leader = "r a", keys = ["Y"] }
"request.decline" = { leader = "r n", keys = ["n"] }
"request.cancel" = { leader = "r c" }

# Graph (when focused): vim-style movement, g-sequences to follow relations.
"graph.left" = { keys = ["h"] }
"graph.down" = { keys = ["j"] }
"graph.up" = { keys = ["k"] }
"graph.right" = { keys = ["l"] }
"graph.callees" = { leader = "g c", keys = ["g c"] }
"graph.callers" = { leader = "g r", keys = ["g r"] }
"graph.parent" = { leader = "g p", keys = ["g p"] }
"graph.children" = { leader = "g n", keys = ["g n"] }
"graph.implements" = { leader = "g i", keys = ["g i"] }
"graph.flows_to" = { leader = "g l", keys = ["g l"] }
"graph.focus" = { leader = "g f", keys = ["Enter"] }
"graph.unfocus" = { leader = "g u", keys = ["Backspace"] }
"graph.depth_more" = { leader = "g +", keys = ["+"] }
"graph.depth_less" = { leader = "g -", keys = ["-"] }
"graph.view" = { leader = "g v" }
"graph.next_view" = { keys = ["v"] }
"graph.plan" = { leader = "g P" }
"graph.back" = { leader = "g [", keys = ["ctrl+o"] }
"graph.forward" = { leader = "g ]", keys = ["ctrl+i"] }
"graph.open_code" = { leader = "g d", keys = ["g d"] }
"graph.open_spec" = { leader = "g s", keys = ["s"] }
"graph.hint" = { leader = "g h", keys = ["f"] }
"graph.hint_focus" = { keys = ["F"] }
"graph.hint_code" = { keys = ["g o"] }
"graph.hint_spec" = { keys = ["S"] }
"graph.zoom_in" = { keys = ["z i"] }
"graph.zoom_out" = { keys = ["z o"] }
"graph.fit" = { leader = "g z", keys = ["z z"] }
"graph.close_inspector" = { leader = "g x", keys = ["x", "Escape"] }
"graph.refresh" = { leader = "g ." }
# Search the view (/ then type, Enter), next/previous match, marks (m then a
# letter sets one, ' then the letter jumps back), first/last node. A count
# before a key repeats it (3j, 2gc): in the graph, digits are counts, so
# switch slots with Tab or the leader there.
"graph.search" = { leader = "g /", keys = ["/"] }
"graph.search_next" = { keys = ["n"] }
"graph.search_prev" = { keys = ["N"] }
"graph.mark_set" = { keys = ["m"] }
"graph.mark_jump" = { keys = ["'"] }
"graph.first" = { keys = ["g g"] }
"graph.last" = { keys = ["G"] }
"graph.legend" = { leader = "g ?", keys = ["?"] }
"graph.agent_return" = { leader = "g a", keys = ["g a"] }

# Spec view (when focused).
"spec.next_section" = { keys = ["] ]", "J"] }
"spec.prev_section" = { keys = ["[ [", "K"] }
"spec.fold" = { keys = ["z a"] }
"spec.pin" = { keys = ["p"] }
"spec.open_code" = { keys = ["g d"] }
"spec.show_in_graph" = { keys = ["g g"] }
# Review: comment on (or ask for a change to) the current section, mark the
# plan reviewed, accept or reopen the answer to the point under review.
"spec.comment" = { keys = ["c"] }
"spec.request_change" = { keys = ["C"] }
"spec.mark_reviewed" = { keys = ["g m"] }
"spec.next_point" = { keys = ["] c"] }
"spec.accept" = { keys = ["a"] }
"spec.reopen" = { keys = ["o"] }

# Code links: code view <-> graph.
"code.reveal" = { leader = "e r", keys = ["g r"] }
"link.follow" = { leader = "e f" }

"code.down" = { keys = ["j"] }
"code.up" = { keys = ["k"] }

# Colors by role: "#rrggbb" or "#rrggbbaa".
[theme]
bg = "#0c0e12"
panel = "#0e1117"
surface = "#12161e"
raised = "#1e2d41"
selection = "#233755"
border = "#1e2430"
border_strong = "#2d374b"
focus = "#508cdc"
grid = "#6a88bf3c"
text_strong = "#ffffff"
text = "#c8d7e6"
muted = "#a0a5af"
faint = "#5a6e87"
on_bright = "#000000"
accent = "#64a0f0"
info = "#8cc8ff"
key = "#ffd700"
ok = "#50c878"
warn = "#fab432"
error = "#f05050"
special = "#b478ff"
info_bg = "#141e30"
ok_bg = "#14301e"
warn_bg = "#241e12"
error_bg = "#3c1418"
special_bg = "#201c30"
overlay = "#111621f5"
overlay_raised = "#29384fdc"
highlight = "#fab43223"
card = "#12161e"
card_selected = "#182230"
card_special = "#161320"
card_special_selected = "#201c30"
card_ok = "#121a16"
card_ok_selected = "#1a241e"
chrome = "#1b1b1b"
widget_selection = "#005c80"
link = "#5aaaff"

# How the graph looks. Colors are theme token names (from [theme] above).
[graph_style.kinds]
contains = "faint"
implements = "special"
calls = "accent"
data_flow = "info"

# Relation lines by how plan and code line up. Without `color`, a line takes
# its kind's color.
[graph_style.edges]
observed = { width = 1.4 }
planned = { width = 1.4, dashed = true }
missing = { color = "error", width = 1.8, dashed = true }
present = { width = 1.6 }

# Width multipliers by where a relation is known from.
[graph_style.provenance]
observed = 1.0
planned = 1.0
both = 1.3

# Overlay relations (drawn over a view's own kinds) are lighter.
[graph_style.overlay]
width = 0.65
alpha = 0.6

[graph_style.nodes]
outline = { observed = { color = "border_strong", width = 1.2 }, planned = { color = "warn", width = 1.2, dashed = true }, missing = { color = "error", width = 1.6 }, present = { color = "ok", width = 1.4 } }
selected_outline = "focus"
selected_width = 2.5
fill = "card"
selected_fill = "card_selected"
# A stripe on the card's left edge by lifecycle stage.
stages = { declared = "faint", arch_approved = "info", plan_approved = "accent", skeleton = "warn", implemented = "ok" }
# Ring around the node the agent pointed at.
agent = "special"

# How the graph behaves.
[graph]
# Long-press a node: these actions (the ones that apply) as chips.
context = ["graph.focus", "graph.open_spec", "graph.open_code", "graph.callees", "graph.callers", "graph.parent", "graph.children", "graph.implements", "graph.flows_to"]

[graph.touch]
# Points a finger may wander and still tap or long-press.
tap_slop = 12.0
double_tap_ms = 320.0
long_press_ms = 550.0
# A swipe (history back/forward) is a quick horizontal flick at least this long.
swipe_min = 90.0
swipe_max_ms = 450.0

# On-screen chips: "auto" (narrow screens, or after a touch), "always" or "never".
[graph.chips]
show = "auto"
narrow_below = 700.0
size = 40.0
actions = ["graph.back", "graph.forward", "graph.fit", "graph.zoom_in", "graph.zoom_out", "graph.next_view", "graph.hint_focus", "graph.legend"]

# Semantic zoom: card detail by zoom level. Below `mid`: the name; from `mid`:
# type, stage and location; from `near`: signature, alignment, placeholders
# and review points.
[graph.detail]
mid = 0.45
near = 0.9
