# How each state looks wherever it's shown: a word, an icon (by name) and a
# theme colour (token name from [theme]). Views never colour a state alone.
[status.index_fresh]
word = "up to date"
icon = "check-circle"
color = "ok"

[status.indexing]
word = "indexing"
icon = "arrows-clockwise"
color = "info"

[status.stale]
word = "out of date"
icon = "clock-counter-clockwise"
color = "warn"

[status.index_failed]
word = "indexing failed"
icon = "warning-octagon"
color = "error"

# Plan against code.
[status.observed]
word = "in code (no plan)"
icon = "code"
color = "muted"

[status.planned]
word = "planned, not built yet"
icon = "circle-dashed"
color = "warn"

[status.missing]
word = "planned, missing in code"
icon = "warning-circle"
color = "error"

[status.present]
word = "planned and in code"
icon = "seal-check"
color = "ok"

# Review and work.
[status.placeholders]
word = "placeholders"
icon = "hourglass"
color = "warn"

[status.open_discussions]
word = "open discussions"
icon = "chat-circle-dots"
color = "warn"

[status.unconfirmed]
word = "unconfirmed flow (the types don't confirm it)"
icon = "question"
color = "warn"

[status.reshapes]
word = "reshapes the data"
icon = "shuffle"
color = "special"

[status.changed]
word = "changed since review"
icon = "pencil-simple"
color = "info"

[status.required_missing]
word = "required, missing"
icon = "flag"
color = "error"

# Stages, in order.
[status.stage_declared]
word = "declared"
icon = "lightbulb"
color = "faint"

[status.stage_arch_approved]
word = "architecture approved"
icon = "check-circle"
color = "info"

[status.stage_plan_approved]
word = "plan approved"
icon = "list-checks"
color = "accent"

[status.stage_skeleton]
word = "skeleton"
icon = "stack"
color = "warn"

[status.stage_implemented]
word = "implemented"
icon = "seal-check"
color = "ok"

# Queue jobs.
[status.job_queued]
word = "queued"
icon = "circle"
color = "muted"

[status.job_running]
word = "running"
icon = "play"
color = "info"

[status.job_awaiting_approval]
word = "needs your approval"
icon = "hand"
color = "warn"

[status.job_retrying]
word = "retrying"
icon = "arrows-clockwise"
color = "warn"

[status.job_failed]
word = "failed"
icon = "x-circle"
color = "error"

[status.job_done]
word = "done"
icon = "check-circle"
color = "ok"

# Finding severities.
[status.severity_error]
word = "error"
icon = "warning-octagon"
color = "error"

[status.severity_warning]
word = "warning"
icon = "warning"
color = "warn"

[status.severity_info]
word = "note"
icon = "eye"
color = "muted"

# How the graph looks. Colors are theme token names (from [theme] above).
[graph_style.kinds]
contains = "faint"
implements = "special"
calls = "accent"
data_flow = "info"

# Lines by their plan mark. Without `color`, a line takes its kind's color.
[graph_style.lines]
code = { width = 1.4 }
new = { width = 1.4, dashed = true }
changed = { color = "info", width = 1.6 }
done = { color = "ok", width = 1.6 }
mismatch = { color = "error", width = 1.8, dashed = true }

# A call found in the code that the language's own analyzer didn't confirm
# (only matched by name): thinner and fainter than a confirmed one.
[graph_style.evidence]
named = { width = 1.0, fade = 0.45 }

# Lines to a card shown elsewhere: one reached again, and one going back up
# its own path (a loop).
[graph_style.back]
repeat = { width = 1.0, dashed = true }
loop = { color = "warn", width = 1.2, dashed = true }

[graph_style.nodes]
outline = { code = { color = "border_strong", width = 1.2 }, new = { color = "warn", width = 1.4, dashed = true }, changed = { color = "info", width = 1.6 }, done = { color = "ok", width = 1.4 }, mismatch = { color = "error", width = 1.8 } }
selected_outline = "focus"
selected_width = 2.5
fill = "card"
selected_fill = "card_selected"
# Ring around the card the agent pointed at.
agent = "special"
# Code a plan only plugs into shows fainter than the plan's own cards.
outside_plan_alpha = 0.55

# The pills on the selection's lines: what goes in, what comes back, and
# (data flow) the step that turns one type into the next.
[graph_style.pills]
in = "info"
out = "ok"
step = "accent"

# How the graph behaves.
[graph]
# Under the selected card: these actions (the ones that apply).
context = ["graph.go_in", "goto.spec", "goto.code"]
# Fitting the drawing to the screen never zooms out past this (text stays
# readable; what doesn't fit is panned to).
readable_zoom = 0.85
# One zoom in (z +) or out (z -) changes the size by this factor.
zoom_step = 1.2
# Text smaller than this many pixels on screen isn't drawn (the card is).
min_text_px = 6.0
# Details kept for cards selected before (fetched again after that).
details_kept = 64

# "Find in the code": results listed per kind, best first.
[graph.find]
symbols = 12
files = 6
text = 8

# The legend's width bounds (its text wraps to fit).
[graph.legend]
min_w = 160.0
max_w = 400.0

# On-screen chips: "auto" (narrow screens, or after a touch), "always" or "never".
[graph.chips]
show = "auto"
narrow_below = 480.0
size = 32.0
actions = ["nav.back", "nav.forward", "graph.fit", "graph.zoom_in", "graph.zoom_out", "graph.view", "graph.flip", "nav.hint_open"]

# The code view's syntax colours: a tree-sitter highlight capture (or its
# first part) -> a theme color. Captures not listed keep the text color.
[code.highlight]
keyword = "accent"
function = "info"
"function.macro" = "special"
type = "special"
constructor = "special"
string = "ok"
"string.special" = "ok"
escape = "warn"
number = "warn"
constant = "warn"
"constant.builtin" = "warn"
comment = "faint"
attribute = "muted"
label = "muted"
operator = "muted"
"punctuation" = "muted"
property = "text"

# The event socket: when it drops, try again after `reconnect_min_ms`, doubling
# up to `reconnect_max_ms`; views refetch once it's back.
# Each panel shows its own buffer (graphs, code, specs, outlines; one chat
# and one queue). How many panels there may be, and where they show the
# buttons of what you're on: "floating" (a box under it) or "bar" (a row of
# their own along each panel's bottom). Changed in the cockpit (Space l b),
# it's kept with its state.
[panels]
max = 12
item_buttons = "floating"

# The changes view (git): context lines around each change and how many
# more "more context" adds; how many files (and changed lines in all) open
# by themselves; how often the list is read again while shown; from what
# panel width "auto" shows changes side by side.
[changes]
context = 3
more_context = 10
open_up_to_files = 30
open_up_to_lines = 600
refresh_s = 5.0
side_by_side_from = 900.0
deleted_in_code = true

[net]
reconnect_min_ms = 500
reconnect_max_ms = 10000
# The layout (panels, where each buffer is, marks, unsent text) is saved on
# the server this long after it last changed.
save_after_ms = 500

