[package]
name = "cockpit-ui"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "web_screen_reader"] }
egui = "0.33.3"
egui_commonmark = "0.22.0"
egui_extras = "0.33.3"
ehttp = "0.5.0"
log = "0.4"
ewebsock = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
web-time = "1"
harness-contracts = { path = "../harness-contracts" }
arch-graph = { path = "../arch-graph" }
arch-search = { path = "../arch-search", default-features = false }
petgraph = "0.6"
egui_graphs = "0.29.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
egui-phosphor = { version = "0.11.0", features = ["regular", "fill"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# A message's markdown cut into its parts (code blocks, tables) as
# CommonMark reads it: the parser egui_commonmark draws with.
pulldown-cmark = { version = "0.13", default-features = false }
# A change an agent made (its file's text before and after) as the Changes
# view's hunks; its clock the browser's on the web.
similar = { version = "3.2", default-features = false, features = ["std", "text", "wasm32_web_time"] }

# The browser's own (only `web/` uses them: anything else that did wouldn't
# build natively, where the tests run).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Location", "console", "Notification", "NotificationOptions", "NotificationPermission", "VisibilityState", "KeyboardEvent", "EventTarget", "AddEventListenerOptions"] }
js-sys = "0.3"

# Native (non-wasm) builds, e.g. unit tests on Linux, need a winit windowing backend.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["x11", "wayland"] }

[dev-dependencies]
proptest = "1"
