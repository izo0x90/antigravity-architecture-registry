[package]
name = "meta-harness"
version = "0.1.0"
edition = "2024"
default-run = "meta-harness"

[workspace]
members = [
    ".",
    "crates/cockpit-ui",
    "crates/architecture-model",
    "crates/harness-contracts",
    "crates/harness-core",
    "crates/harness-acp",
    "crates/workspace-fs",
    "crates/provider-antigravity",
    "crates/arch-graph",
    "crates/arch-index",
    "crates/arch-service",
]

[lib]
crate-type = ["rlib"]

[dependencies]
harness-contracts = { path = "crates/harness-contracts" }
harness-core = { path = "crates/harness-core" }
provider-antigravity = { path = "crates/provider-antigravity" }
architecture-model = { path = "crates/architecture-model" }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
ast-grep-config = "0.45.3"
ast-grep-core = "0.45.3"
tempfile = "3.27.0"
