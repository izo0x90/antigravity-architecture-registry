[package]
name = "meta-harness"
version = "0.1.0"
edition = "2024"
default-run = "meta-harness"

[workspace]
members = [
    ".",
    "crates/cockpit-ui",
    "crates/harness-contracts",
    "crates/harness-core",
    "crates/harness-acp",
    "crates/workspace-fs",
    "crates/provider-antigravity",
    "crates/arch-graph",
    "crates/arch-index",
    "crates/arch-service",
    "crates/arch-store",
    "crates/arch-search",
]

# Debug builds (tests, and the server as run in development) optimize the
# parsing, graph and service code and every dependency: unoptimized
# tree-sitter and graph walks are ten times slower, which hides real
# performance and makes the dev server freeze-prone.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.arch-graph]
opt-level = 2

[profile.dev.package.arch-index]
opt-level = 2

[profile.dev.package.arch-service]
opt-level = 2

[lib]
crate-type = ["rlib"]

[dependencies]
harness-contracts = { path = "crates/harness-contracts" }
harness-core = { path = "crates/harness-core" }
provider-antigravity = { path = "crates/provider-antigravity" }
arch-graph = { path = "crates/arch-graph" }
arch-index = { path = "crates/arch-index" }
arch-service = { path = "crates/arch-service" }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip"] }
tower = "0.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
notify = "8"

[dev-dependencies]
ast-grep-config = "0.45.3"
ast-grep-core = "0.45.3"
tempfile = "3.27.0"
tokio-tungstenite = "0.29"
