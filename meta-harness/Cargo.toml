[package]
name = "meta-harness"
version = "0.1.0"
edition = "2024"
default-run = "meta-harness"

[workspace]
members = [
    ".",
    "crates/cockpit-ui",
    "crates/harness-protocol",
]

[lib]
crate-type = ["rlib"]

[dependencies]
harness-protocol = { path = "crates/harness-protocol" }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
eframe = "0.33.3"
egui = "0.33.3"
egui_commonmark = "0.22.0"
egui_extras = "0.33.3"
ehttp = "0.5.0"
ewebsock = "0.8.0"
futures = "0.3.34"
libc = "0.2"
regex = "1.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Location"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
ast-grep-config = "0.45.3"
ast-grep-core = "0.45.3"
tempfile = "3.27.0"
