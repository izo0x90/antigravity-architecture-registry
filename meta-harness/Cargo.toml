[package]
name = "meta-harness"
version = "0.1.0"
edition = "2024"
default-run = "meta-harness"

[workspace]
members = [
    ".",
    "crates/cockpit-ui",
    "crates/harness-contracts",
    "crates/harness-core",
    "crates/harness-acp",
    "crates/workspace-fs",
    "crates/arch-graph",
    "crates/code-analyzer",
    "crates/arch-service",
    "crates/arch-store",
    "crates/arch-search",
    "crates/nah-packs",
    "crates/nah-lsp",
    "crates/nah-access",
    "crates/nah-state",
    "crates/nah-notify",
    "crates/nah-changes",
    "crates/nah-timeline",
    "crates/nah-terminal",
    "crates/nah-tags",
]

# Debug builds (tests, and the server as run in development) optimize the
# parsing, graph and service code and every dependency: unoptimized
# tree-sitter and graph walks are ten times slower, which hides real
# performance and makes the dev server freeze-prone.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.arch-graph]
opt-level = 2

[profile.dev.package.code-analyzer]
opt-level = 2

[profile.dev.package.arch-service]
opt-level = 2

[profile.dev.package.arch-search]
opt-level = 2

[lib]
crate-type = ["rlib"]

[dependencies]
harness-contracts = { path = "crates/harness-contracts" }
harness-core = { path = "crates/harness-core" }
harness-acp = { path = "crates/harness-acp" }
arch-graph = { path = "crates/arch-graph" }
code-analyzer = { path = "crates/code-analyzer" }
arch-service = { path = "crates/arch-service" }
nah-packs = { path = "crates/nah-packs" }
nah-access = { path = "crates/nah-access" }
arch-search = { path = "crates/arch-search" }
nah-state = { path = "crates/nah-state" }
nah-notify = { path = "crates/nah-notify" }
nah-changes = { path = "crates/nah-changes" }
nah-timeline = { path = "crates/nah-timeline" }
nah-terminal = { path = "crates/nah-terminal" }
nah-tags = { path = "crates/nah-tags" }
include_dir = "0.7"
clap = { version = "4", features = ["derive"] }
tokio-tungstenite = "0.29"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
dirs = "7"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip"] }
tower = "0.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

notify-debouncer-full = "0.5"

[dev-dependencies]
nah-packs = { path = "crates/nah-packs", features = ["testing"] }
harness-acp = { path = "crates/harness-acp", features = ["testing"] }
cockpit-ui = { path = "crates/cockpit-ui" }
ast-grep-config = "0.45.3"
ast-grep-core = "0.45.3"
tempfile = "3.27.0"
regex = "1"
